<script>
/* Navigation is presentation-only: no account logout, game reset, or simulation actions. */
function installLastLightNavigation(target = window) {
  if (target.LastLightNavigation) return target.LastLightNavigation;
  const history = target.history;
  const marker = "lastlight-navigation-v15";
  let listener = null;
  let busy = false;
  let queued = null;
  let unwindTarget = null;
  const own = (s) => s && s.marker === marker;
  const state = (kind, view) => ({ marker, kind, view: view || {}, depth: kind === "title" ? 0 : kind === "world" ? 1 : 2 });
  const emit = (s) => {
    busy = true;
    const data = JSON.stringify({ kind: s.kind, view: s.view || {} });
    if (listener) listener(data); else queued = data;
  };
  const initial = state("title", {});
  history.replaceState({ ...(history.state || {}), ...initial }, "", target.location.href);
  target.addEventListener("popstate", (event) => {
    // Game-driven Close/start-combat/start-search already changed the simulation.
    // Remove its overlay history entry without replaying an older district/menu.
    if (unwindTarget) {
      const newest = unwindTarget;unwindTarget = null;busy = false;
      if (own(event.state) && state(newest.kind,newest.view).depth <= event.state.depth) {
        history.replaceState(state(newest.kind,newest.view), "", target.location.href);
      } else bridge.sync(JSON.stringify(newest));
      return;
    }
    if (own(event.state)) emit(event.state);
  });
  const bridge = {
    attach(callback) { listener = callback; if (queued) { const data = queued; queued = null; listener(data); } },
    sync(json) {
      const data = JSON.parse(String(json));
      if (busy) { if (unwindTarget) unwindTarget = data; return; }
      const next = state(data.kind, data.view);
      const current = own(history.state) ? history.state : initial;
      if (next.kind === current.kind) {
        if (JSON.stringify(next.view) !== JSON.stringify(current.view)) history.replaceState(next, "", target.location.href);
        return;
      }
      // Returning via in-game Close/Back removes the overlay entry, instead of creating a loop.
      if (next.depth < current.depth) { busy = true; unwindTarget = data; history.go(next.depth - current.depth); return; }
      if (next.kind === "popup" && current.kind === "title") {
        if (data.inGame) {
          const base = { ...next.view, mode: next.view.base === "explore" ? "explore" : "hub", menu: "" };
          history.pushState(state("world", base), "", target.location.href);
        } else { next.depth = 1; next.parent = "title"; }
      }
      history.pushState(next, "", target.location.href);
    },
    acknowledge(json) {
      const data = JSON.parse(String(json));
      const next = state(data.kind, data.view);
      if (own(history.state) && next.depth < Number(history.state.depth)) { history.go(next.depth - Number(history.state.depth)); return; }
      // v28: 게임 중 뒤로 가기로 입장 화면 항목에 도달했으면, 게임 화면 항목을 다시 쌓아 로비로 나가지 않게 한다.
      if (own(history.state) && Number(history.state.depth) === 0 && next.depth > 0) { history.pushState(next, "", target.location.href); busy = false; return; }
      if (own(history.state)) history.replaceState(next, "", target.location.href);
      busy = false;
    },
    snapshot() { return JSON.stringify(own(history.state) ? history.state : initial); }
  };
  target.LastLightNavigation = bridge;
  return bridge;
}
if (typeof window !== "undefined") installLastLightNavigation(window);

</script>

<script type="module">
    // merchant-bridge:start
function installMerchantBridge({F,auth,db,bridge,reply,fail,subs,stopSub}) {
  const ref=F.doc(db,'worldEvents','merchant');
  bridge.watchMerchant=(cb)=>{
    stopSub('merchant');
    if(!auth.currentUser){reply(cb,{ok:false,error:'로그인이 필요합니다.'});return;}
    subs.merchant=F.onSnapshot(ref,snap=>{
      const d=snap.exists()?snap.data():null;
      reply(cb,{ok:true,event:d?{key:d.key,start:Math.floor(d.startsAt.toMillis()/1000),end:Math.floor(d.endsAt.toMillis()/1000)}:{}});
    },e=>fail(cb,e));
  };
  bridge.forceMerchant=async(cb)=>{
    try{
      const user=auth.currentUser;
      if(!user)throw new Error('로그인이 필요합니다.');
      const admin=await F.getDoc(F.doc(db,'admins',user.uid));
      if(!admin.exists())throw new Error('관리자 전용입니다.');
      const starts=Date.now(),key='admin-'+F.doc(F.collection(db,'worldEvents')).id;
      await F.setDoc(ref,{key,startsAt:F.Timestamp.fromMillis(starts),endsAt:F.Timestamp.fromMillis(starts+3600000),by:user.uid,updatedAt:F.serverTimestamp()});
      reply(cb,{ok:true,key});
    }catch(e){fail(cb,e);}
  };
  const repairRef=F.doc(db,'worldSettings','repair');
  bridge.watchRepairPolicy=cb=>{
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    stopSub('repair_policy');
    subs.repair_policy=F.onSnapshot(repairRef,s=>{const d=s.exists()?s.data():{fee:5,rate:20};reply(cb,{ok:true,fee:d.fee,rate:d.rate});},e=>fail(cb,String(e.message||e)));
  };
  // v36.5: 생존 수치 감소 속도(관리자 설정). 문서 하나만 구독한다.
  const survivalRef=F.doc(db,'worldSettings','survival');
  bridge.watchSurvivalRates=cb=>{
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    stopSub('survival_rates');
    subs.survival_rates=F.onSnapshot(survivalRef,s=>{const d=s.exists()?s.data():{};reply(cb,{ok:true,hunger:Number(d.hunger)||100,water:Number(d.water)||100,morale:Number(d.morale)||100});},e=>fail(cb,String(e.message||e)));
  };
  bridge.setSurvivalRates=async(hunger,water,morale,cb)=>{
    try{
      const u=auth.currentUser;if(!u)throw new Error('로그인이 필요합니다.');
      if(!(await F.getDoc(F.doc(db,'admins',u.uid))).exists())throw new Error('관리자 전용입니다.');
      const ok=v=>Number.isInteger(v)&&v>=25&&v<=300;
      if(!ok(hunger)||!ok(water)||!ok(morale))throw new Error('각 값은 25~300% 사이여야 합니다.');
      await F.setDoc(survivalRef,{hunger,water,morale,by:u.uid,updatedAt:F.serverTimestamp()});reply(cb,{ok:true,hunger,water,morale});
    }catch(e){fail(cb,String(e.message||e));}
  };
  // v36.8: 감염 사망 규칙(변이·좀비화) 켜기/끄기. 서버 전체 설정.
  const infectionRef=F.doc(db,'worldSettings','infection');
  bridge.watchInfectionRule=cb=>{
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    stopSub('infection_rule');
    subs.infection_rule=F.onSnapshot(infectionRef,s=>reply(cb,{ok:true,on:s.exists()&&s.data().on===true}),e=>fail(cb,String(e.message||e)));
  };
  bridge.setInfectionRule=async(on,cb)=>{
    try{

// Embedded into loading.html by tools/sync_registration.py before export.
// Only hashes are used as document identifiers. The default code is never shipped in the game.
function createRegistrationBridge({ A, F, auth, db, bridge, reply, fail, message, current,
  setProfile, setCreating, afterCreate, ID_DOMAIN, ID_PATTERN }) {
  const settingRef = F.doc(db, "registrationSettings", "main");
  const normalize = (value) => String(value || "").trim().toUpperCase();
  const codePattern = /^[A-Z0-9-]{6,32}$/;
  const millis = (value) => value?.toMillis ? value.toMillis() : 0;
  const hashCode = async (value) => {
    const bytes = new TextEncoder().encode("lastlight-register-v1:" + normalize(value));
    const digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
  };
  const requiredFrom = (snap) => !snap.exists() || snap.data().required !== false;
  const checkCode = (snap) => {
    if (!snap.exists()) throw new Error("가입 코드가 올바르지 않습니다.");
    const data = snap.data();
    if (!data.active) throw new Error("사용이 중지된 가입 코드입니다.");
    if (data.expiresAt && millis(data.expiresAt) <= Date.now()) throw new Error("유효기간이 지난 가입 코드입니다.");
    if (data.maxUses > 0 && data.used >= data.maxUses) throw new Error("사용 횟수가 모두 소진된 가입 코드입니다.");
    return data;
  };
  const errorText = (error) => error?.code ? message(error) : String(error?.message || "요청에 실패했습니다.");
  const ensureAdmin = async () => {
    const user = auth.currentUser;
    if (!user) throw new Error("관리자 로그인이 필요합니다.");
    if (!(await F.getDoc(F.doc(db, "admins", user.uid))).exists()) throw new Error("관리자만 사용할 수 있습니다.");
    return user;
  };
  bridge.registrationPolicy = async (cb) => {
    try { reply(cb, { ok: true, required: requiredFrom(await F.getDoc(settingRef)) }); }
    catch (error) { fail(cb, "가입 설정을 읽지 못했습니다. 새 보안 규칙 배포를 확인하세요. " + errorText(error)); }
  };
  bridge.signUp = async (username, password, nickname, code, cb) => {
    username = String(username || "").trim().toLowerCase();
    nickname = String(nickname || "").trim();
    if (!ID_PATTERN.test(username)) return fail(cb, "아이디는 영문 소문자, 숫자, _ 로 4~16자입니다.");
    if (String(password).length < 6) return fail(cb, "비밀번호는 6자 이상이어야 합니다.");
    if (nickname.length < 2 || nickname.length > 10) return fail(cb, "닉네임은 2~10자입니다.");

    let committed = false;
    try {
      // Reject ordinary invalid attempts before creating a Firebase Authentication user.
      const required = requiredFrom(await F.getDoc(settingRef));
      const normalized = normalize(code);
      let codeRef = null;
      let codeHash = "";
      if (normalized && codePattern.test(normalized)) {
        codeHash = await hashCode(normalized);
        codeRef = F.doc(db, "registrationCodes", codeHash);
      }
      if (required) {
        if (!codeRef) throw new Error("관리자에게 받은 가입 코드를 입력하세요.");
        checkCode(await F.getDoc(codeRef));
      }
      setCreating(true);
      const cred = await A.createUserWithEmailAndPassword(auth, username + "@" + ID_DOMAIN, String(password));
      createdUser = cred.user;
      const profileRef = F.doc(db, "profiles", createdUser.uid);
      const claimRef = F.doc(db, "registrationClaims", createdUser.uid);
      // Policy, one use, receipt and profile commit atomically; the rules enforce the same invariant.
      await F.runTransaction(db, async (tx) => {
        const policy = await tx.get(settingRef);
        const needCode = requiredFrom(policy);
        let codeData = null;
        if (needCode) {
          if (!codeRef) throw new Error("코드 가입이 켜졌습니다. 가입 코드를 입력한 뒤 다시 시도하세요.");
          codeData = checkCode(await tx.get(codeRef));
        }
        const previous = await tx.get(profileRef);
        if (previous.exists()) throw new Error("이미 게임에 가입한 계정입니다.");
        if (needCode) {
          tx.update(codeRef, { used: codeData.used + 1 });
          tx.set(claimRef, { codeHash, createdAt: F.serverTimestamp() });
        }
        tx.set(profileRef, { username, nickname, level: 1, updatedAt: F.serverTimestamp() });
      });
      committed = true;
      setProfile({ username, nickname, level: 1 });
      // v36.25: 가입 직후에도 캐릭터 슬롯을 만들어 두어, 첫 캐릭터 만들기에서 캐릭터 이름·나이를 바로 정할 수 있게 한다.
      if (afterCreate) { try { await afterCreate(createdUser, { username, nickname, level: 1 }); } catch (e) { console.warn("character slot", e); } }
      reply(cb, current());
    } catch (error) {
      // Clean up only the fresh user from this attempt; never delete a previous/approved account.
      if (createdUser && !committed) {
        try { await A.deleteUser(createdUser); }
        catch (cleanupError) { try { await A.signOut(auth); } catch (_) {} }
        setProfile(null);
      }
      fail(cb, errorText(error));
    } finally { setCreating(false); }
  };
  bridge.adminRegistration = async (cb) => {
    try {
      await ensureAdmin();
      const policy = await F.getDoc(settingRef);
      const snap = await F.getDocs(F.query(F.collection(db, "registrationCodes"), F.orderBy("createdAt", "desc"), F.limit(100)));

        const data = entry.data();

          maxUses: data.maxUses, expiresAt: Math.floor(millis(data.expiresAt) / 1000) };
      });
      reply(cb, { ok: true, required: requiredFrom(policy), initialized: policy.exists(), codes });
    } catch (error) { fail(cb, errorText(error)); }
  };
  bridge.adminSetRegistration = async (required, cb) => {
    try {
      await ensureAdmin();
      await F.setDoc(settingRef, { required: required === true, updatedAt: F.serverTimestamp() });
      reply(cb, { ok: true, required: required === true });
    } catch (error) { fail(cb, errorText(error)); }
  };
  bridge.adminCreateCode = async (text, maximum, days, cb) => {
    try {
      await ensureAdmin();
      let code = normalize(text);
      if (!code) {
        const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const random = crypto.getRandomValues(new Uint8Array(12));
        code = "LL-" + Array.from(random, (byte) => alphabet[byte % alphabet.length]).join("");
      }
      if (!codePattern.test(code)) throw new Error("코드는 영문 대문자·숫자·- 로 6~32자입니다.");
      const maxUses = Number(maximum);
      const expiryDays = Number(days);
      if (!Number.isInteger(maxUses) || maxUses < 0 || maxUses > 10000) throw new Error("허용 횟수는 0~10,000입니다.");
      if (!Number.isInteger(expiryDays) || expiryDays < 0 || expiryDays > 365) throw new Error("유효기간은 0~365일입니다.");
      const ref = F.doc(db, "registrationCodes", await hashCode(code));
      await F.runTransaction(db, async (tx) => {
        if ((await tx.get(F.doc(db, "registrationCodeTombstones", ref.id))).exists()) throw new Error("삭제한 코드는 재발급할 수 없습니다. 다른 코드를 사용하세요.");
        if ((await tx.get(ref)).exists()) throw new Error("이미 발급된 코드입니다. 목록에서 다시 활성화하거나 새 코드를 사용하세요.");
        tx.set(ref, { code, active: true, used: 0, maxUses,
          expiresAt: expiryDays ? F.Timestamp.fromMillis(Date.now() + expiryDays * 86400000) : null,
          createdAt: F.serverTimestamp() });
      });
      reply(cb, { ok: true, code });
    } catch (error) { fail(cb, errorText(error)); }
  };
  bridge.adminSetCodeActive = async (id, active, cb) => {
    try {
      await ensureAdmin();
      if (!/^[0-9a-f]{64}$/.test(String(id))) throw new Error("올바르지 않은 코드입니다.");
      await F.updateDoc(F.doc(db, "registrationCodes", id), { active: active === true });
      reply(cb, { ok: true });
    } catch (error) { fail(cb, errorText(error)); }
  };
  bridge.adminDeleteCode = async (id, cb) => {
    try {
      const user = await ensureAdmin();
      if (!/^[0-9a-f]{64}$/.test(String(id))) throw new Error("올바르지 않은 코드입니다.");
      const ref=F.doc(db,"registrationCodes",id), tomb=F.doc(db,"registrationCodeTombstones",id);
      await F.runTransaction(db,async tx=>{
        const snap=await tx.get(ref);if(!snap.exists())throw new Error("이미 삭제된 코드입니다.");
        tx.set(tomb,{codeHash:id,code:String(snap.data().code),used:Number(snap.data().used),by:user.uid,deletedAt:F.serverTimestamp()});
        tx.delete(ref);
      });
      reply(cb,{ok:true});
    } catch(error){fail(cb,errorText(error));}
  };
  return { requiredFrom };
}

function installDMBridge({R,F,auth,db,rtdb,bridge,reply,fail,subs,stopSub,meId}) {

    const u=auth.currentUser;if(!u)return fail(cb,'로그인이 필요합니다.');

    if(subs.sess){try{subs.sess();}catch(_){}delete subs.sess;}

        reply(cb,{ok:true,type:'claimed',hadOther:had});

      const s=await R.get(R.query(path('dm/rooms/'+room+'/messages'),R.orderByKey(),R.endAt(keyAt(cut)),R.limitToLast(80)));
      const upd={};s.forEach(c=>{const at=Number((c.val()||{}).createdAt)||0;if(at&&at<cut)upd['dm/rooms/'+room+'/messages/'+c.key]=null;});
      if(Object.keys(upd).length){await R.update(R.ref(rtdb),upd);if(Object.keys(upd).length>=80)prunedRooms.delete(room);}
    }catch(e){console.warn('dm prune',e);}

  const warmRate=uid=>{if(rateWarm===uid)return;rateWarm=uid;try{R.onValue(path('dmRate/'+uid),()=>{},()=>{});}catch(_){}};
  const ensureRoom=async peer=>{
    const me=me_();peer=clean(peer);if(peer===me.uid||peer.split('_c')[0]===me.owner)throw new Error('본인 캐릭터에게는 쪽지를 보낼 수 없습니다.');
    warmRate(me.uid);
    const known=roomId(me.uid,peer);if(knownRooms.has(known))return known;
    await Promise.all([directory(me.uid),directory(peer)]);
    const room=roomId(me.uid,peer),ref=path('dm/rooms/'+room+'/meta');
    const old=await R.get(ref);

      const [a,b]=[me.uid,peer].sort();
      try{await R.set(ref,{a,b,members:{[a]:true,[b]:true},createdAt:stamp()});}
      catch(e){const now=await R.get(ref);if(!now.exists())throw e;}
    }
    knownRooms.add(room);
    return room;
  };
  bridge.dmSend=async(peer,text,cb)=>{
    let pid='';
    try{
      const me=me_();peer=clean(peer);text=String(text||'').trim();if(!text||text.length>500)throw new Error('쪽지는 1~500자까지 보낼 수 있습니다.');
      const room=await ensureRoom(peer),msgRef=R.push(path('dm/rooms/'+room+'/messages')),id=msgRef.key;
      pid=id;pendingDM.set(id,{room,id,uid:me.uid,text,createdAt:Date.now(),pending:true});if(dmEmit)dmEmit();
      const gm=(await directory(me.uid)).isGM===true&&me.uid===me.owner;
      const reservation=await R.runTransaction(path('dmRate/'+me.uid),old=>{
        const now=Date.now();if(old&&old.count>=7&&Number(old.lastAt)+30000>now)return;
        const keep=old&&now<Number(old.windowStartedAt)+30000;
        return {seq:Number(old?.seq||0)+1,count:keep?Number(old.count)+1:1,windowStartedAt:keep?old.windowStartedAt:stamp(),lastAt:stamp(),room,messageId:id};
      },{applyLocally:false});
      if(!reservation.committed){pendingDM.delete(id);if(dmEmit)dmEmit();reply(cb,{ok:false,error:'쪽지 도배 방지 · 30초 뒤에 다시 시도해 주세요.',cooldown:30});return;}
      const rate=reservation.snapshot.val();
      const message={senderUid:me.uid,receiverUid:peer,text,createdAt:stamp(),isGM:gm,seq:rate.seq};
      const summary={room,messageId:id,senderUid:me.uid,lastAt:stamp()};
      await R.update(path('dm'),{['rooms/'+room+'/messages/'+id]:message,['inbox/'+me.uid+'/'+peer]:summary,['inbox/'+peer+'/'+me.uid]:summary});
      reply(cb,{ok:true,id,cooldown:rate.count>=7?30:0});
    }catch(e){if(pid){pendingDM.delete(pid);if(dmEmit)dmEmit();}fail(cb,error(e));}
  };
  bridge.dmRead=async(peer,at,cb)=>{
    try{const me=me_(),room=roomId(me.uid,peer);at=Math.max(0,Math.trunc(Number(at)||0));
      await R.runTransaction(path('dm/read/'+me.uid+'/'+room),old=>({at:Math.max(Number(old?.at||0),at)}),{applyLocally:false});reply(cb,{ok:true});
    }catch(e){fail(cb,error(e));}
  };
  bridge.dmBlock=async(peer,blocked,cb)=>{
    try{const me=me_();peer=clean(peer);if(peer===me.uid)throw new Error('본인은 차단할 수 없습니다.');await R.set(path('dm/blocks/'+me.uid+'/'+peer),blocked?true:null);reply(cb,{ok:true});}
    catch(e){fail(cb,error(e));}
  };
  bridge.watchDMInbox=cb=>{
    stopSub('dm_inbox');cache.clear();let me;try{me=me_();}catch(e){fail(cb,error(e));return;}
    let inbox={},read={},blocks={},serial=0;
    const emit=async()=>{
      const generation=++serial;
      try{
        const cut=dmCut(),stale=Object.entries(inbox).filter(([,x])=>Number(x?.lastAt||0)&&Number(x.lastAt)<cut);
        if(stale.length){const upd={};stale.forEach(([peer])=>{upd['dm/inbox/'+me.uid+'/'+peer]=null;});R.update(R.ref(rtdb),upd).catch(e=>console.warn('dm inbox prune',e));}
        const entries=await Promise.all(Object.entries(inbox).filter(([,x])=>!(Number(x?.lastAt||0)&&Number(x.lastAt)<cut)).map(async([peer,x])=>{
          const d=await directory(peer);return {peer,nickname:d.nickname,isGM:d.isGM===true,...x,blocked:blocks[peer]===true,unread:x.senderUid!==me.uid&&Number(x.lastAt)>Number(read[x.room]?.at||0)};
        }));
        if(generation!==serial||auth.currentUser?.uid!==me.owner)return;
        entries.sort((a,b)=>Number(b.lastAt)-Number(a.lastAt));reply(cb,{ok:true,entries,blocked:blocks});
      }catch(e){if(generation===serial)fail(cb,error(e));}
    };
    const off=[];
    const watch=(p,assign)=>off.push(R.onValue(p,s=>{assign(s.val()||{});emit();},e=>fail(cb,error(e))));
    watch(R.query(path('dm/inbox/'+me.uid),R.orderByChild('lastAt'),R.limitToLast(100)),v=>{inbox=v;});
    watch(path('dm/read/'+me.uid),v=>{read=v;});watch(path('dm/blocks/'+me.uid),v=>{blocks=v;});

  };
  bridge.watchDM=async(peer,cb)=>{
    stopSub('dm');const generation=++epoch;
    try{
      const me=me_(),room=await ensureRoom(peer),ref=R.query(path('dm/rooms/'+room+'/messages'),R.orderByKey(),R.limitToLast(80));
      pruneRoom(room);
      const names=await Promise.all([directory(me.uid),directory(peer)]);if(generation!==epoch||auth.currentUser?.uid!==me.owner)return;
      const hm=ms=>new Date(Number(ms)).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false});
      let last=[];
      dmEmit=()=>{
        if(generation!==epoch)return;
        const ids=new Set(last.map(m=>m.id));
        const extra=[];for(const [k,v] of pendingDM){if(ids.has(k)){pendingDM.delete(k);continue;}if(v.room===room)extra.push({id:k,uid:v.uid,nickname:names[0].nickname,text:v.text,isGM:false,createdAt:v.createdAt,time:hm(v.createdAt)+' · 보내는 중'});}
        reply(cb,{ok:true,peer,room,messages:last.concat(extra)});
      };
      subs.dm=R.onValue(ref,s=>{
        if(generation!==epoch||auth.currentUser?.uid!==me.owner)return;
        const messages=[],cutShow=dmCut();s.forEach(child=>{const x=child.val(),self=x.senderUid===me.uid;if(Number(x.createdAt)&&Number(x.createdAt)<cutShow)return;
          messages.push({id:child.key,uid:x.senderUid,nickname:names[self?0:1].nickname,text:x.text,isGM:x.isGM===true,createdAt:Number(x.createdAt),time:hm(x.createdAt)});
        });
        last=messages;dmEmit();
      },e=>fail(cb,error(e)));
    }catch(e){if(generation===epoch)fail(cb,error(e));}
  };
  bridge.dmSyncDirectory=async cb=>{
    try{
      const me=user(),gm=await R.get(path('dmAdmins/'+me.uid));if(gm.val()!==true)throw new Error('관리자 초기 설정 후 사용할 수 있습니다.');
      const [profiles,admins]=await Promise.all([F.getDocs(F.collection(db,'profiles')),F.getDocs(F.collection(db,'admins'))]);
      const adminSet=new Set(admins.docs.map(d=>d.id)),rows={};
      profiles.docs.forEach(s=>{const d=s.data();if(uidPattern.test(s.id))rows[s.id]={uid:s.id,nickname:String(d.nickname||d.username||'생존자').slice(0,16),isGM:adminSet.has(s.id)};});
      // Administrator UID additions/removals remain Cloud Shell-only; do not assign new admin roles here.
      // v36: 기존 항목(두 번째 캐릭터 포함)은 지우지 않고, 없는 계정만 채운다.
      const have=(await R.get(path('dmDirectory'))).val()||{};for(const k of Object.keys(rows))if(have[k])delete rows[k];
      if(Object.keys(rows).length)await R.update(path('dmDirectory'),rows);cache.clear();reply(cb,{ok:true,count:Object.keys(rows).length});
    }catch(e){fail(cb,error(e));}
  };
  const send=bridge.sendChat,subscribe=bridge.subscribe,unsubscribe=bridge.unsubscribe;
  bridge.sendChat=(key,text,cb)=>String(key).startsWith('dm:')?bridge.dmSend(String(key).slice(3),text,cb):send(key,text,cb);
  bridge.subscribe=(key,cb)=>String(key).startsWith('dm:')?bridge.watchDM(String(key).slice(3),cb):subscribe(key,cb);
  bridge.unsubscribe=key=>{if(key==='dm'){epoch++;}if(key==='dm_inbox')cache.clear();unsubscribe(key);};
}
if(typeof window!=='undefined')window.installDMBridge=installDMBridge;

// free-tier-bridge:start
/* v33 무료 운영판. 접속자 목록·친구 접속 상태·월드 채팅은 Realtime Database로 옮기고,
   Firestore presence 문서는 소셜 판정(치료·소생·교환·결투)에 필요한 순간에만 갱신한다. */
function installFreeTierBridge({R,F,auth,db,rtdb,bridge,reply,fail,message,subs,stopSub,nickOf,meId}) {
  const path=p=>R.ref(rtdb,p);
  const user=()=>{const u=auth.currentUser;if(!u)throw new Error('로그인이 필요합니다.');return u;};
  const text=e=>{const s=String(e?.message||e||'요청에 실패했습니다.');return s.includes('PERMISSION_DENIED')||e?.code==='PERMISSION_DENIED'?'서버 보안 규칙을 확인해 주세요. (Realtime Database 규칙 배포 필요)':(typeof message==='function'&&e?.code?message(e):s);};
  const ms=v=>v&&typeof v.toMillis==='function'?v.toMillis():0;
  const BAD_KEY=/[.#$\[\]\/]/;
  let offset=0;
  try{R.onValue(path('.info/serverTimeOffset'),s=>{offset=Number(s.val())||0;});}catch(_){}
  const serverNow=()=>Date.now()+offset;

  // ---------- 접속자 (RTDB online/$uid) ----------
  // v36.3: 서버를 가볍게. 모두가 구독하는 online/ 에는 목록에 필요한 몇 가지만 두고(자주 바뀌는 체력·능력치는 빼고),
  // 자세한 정보는 onlineInfo/$uid 에 따로 두어 프로필을 열 때만 한 번 읽는다.
  // v36.16: 바뀐 게 없을 때 '접속 중' 표시를 새로 쓰는 간격 10분 → 15분(들어오고 나가는 건 바로 반영).
  const FS_MIN_GAP=20*60000, RT_REFRESH=15*60000, DETAIL_GAP=4*60000;
  const LIGHT_KEYS=['level','dead','isGM','regionId','region','charId','tripId'];
  const lightInfo=i=>{const o={};for(const k of LIGHT_KEYS)if(i&&i[k]!==undefined&&i[k]!==null)o[k]=i[k];return o;};
  let detailSent='',detailAt=0,detailUid='';
  let latest=null, rtUid='', rtSent=null, rtSentAt=0, rtBusy=Promise.resolve(), rtConnected=false, seenConnect=false, offConnected=null;
  let fsSent='', fsKey='', fsSentAt=0, fsBusy=null;
  const flat=(obj,prefix,out)=>{
    for(const [k,v] of Object.entries(obj||{})){
      if(!k||BAD_KEY.test(k))continue;
      const key=prefix+k;
      if(v&&typeof v==='object'&&!Array.isArray(v)){if(Object.keys(v).length)flat(v,key+'/',out);}
      else if(Array.isArray(v))out[key]=JSON.stringify(v);
      else if(v!==undefined&&v!==null&&!(typeof v==='number'&&!Number.isFinite(v)))out[key]=v;
    }
    return out;
  };
  const build=(d,u)=>({
    nickname:String(nickOf(u)).slice(0,10)||'생존자',
    avatar:Math.max(0,Math.min(99,parseInt(d.avatar,10)||0)),
    info:{...((d.info&&typeof d.info==='object'&&!Array.isArray(d.info))?d.info:{}),charId:(meId&&meId())||u.uid},
    photo:String(d.photo||'').slice(0,20000)
  });
  const keyOf=p=>{const i=p.info||{};return JSON.stringify([p.nickname,p.avatar,p.photo.length,p.photo.slice(-64),i.regionId,i.region,i.dead,i.level,i.maxHp,i.isGM===true,i.tripId||'',i.character||{}]);};
  // 사진은 photos/$uid에 따로 두고 접속자 노드에는 짧은 지문(ph)만 둔다.
  // 사진이 바뀔 때만 한 번 내려받으므로 60명이 동시에 있어도 데이터 전송량이 작다.
  const photoHash=s=>{s=String(s||'');if(!s)return '';let h=5381;for(let i=0;i<s.length;i+=7)h=((h*33)^s.charCodeAt(i))>>>0;return s.length.toString(36)+'-'+h.toString(36);};
  let photoSent={uid:'',ph:null};
  const rtWrite=async(force)=>{
    const u=auth.currentUser;if(!u||!latest)return;
    const node=path('online/'+u.uid);
    const ph=photoHash(latest.photo);
    if(photoSent.uid!==u.uid||photoSent.ph!==ph){
      if(latest.photo)await R.set(path('photos/'+u.uid),latest.photo);else{try{await R.remove(path('photos/'+u.uid));}catch(_){}}
      photoSent={uid:u.uid,ph};
    }
    // 자세한 정보: 바뀌었고 4분이 지났을 때만(레벨·사망·위치처럼 중요한 값이 바뀌면 바로) 쓴다.
    try{
      const body=JSON.stringify(latest.info||{});
      let prev={};try{prev=JSON.parse(detailSent||'{}');}catch(_){}
      const important=detailUid!==u.uid||JSON.stringify(lightInfo(latest.info))!==JSON.stringify(lightInfo(prev))||(latest.info||{}).duelReady!==prev.duelReady;
      if(body!==detailSent&&(force||important||Date.now()-detailAt>=DETAIL_GAP)){
        await R.set(path('onlineInfo/'+u.uid),{...latest.info,at:R.serverTimestamp()});
        detailSent=body;detailAt=Date.now();detailUid=u.uid;
        try{await R.onDisconnect(path('onlineInfo/'+u.uid)).remove();}catch(_){}
      }
    }catch(e){console.warn('online detail',e);}
    const next=flat({nickname:latest.nickname,avatar:latest.avatar,ph,info:lightInfo(latest.info)},'',{});
    const due=Date.now()-rtSentAt>=RT_REFRESH;
    if(!force&&rtUid===u.uid&&rtSent){
      const patch={};
      for(const k of Object.keys(next))if(rtSent[k]!==next[k])patch[k]=next[k];
      for(const k of Object.keys(rtSent))if(!(k in next))patch[k]=null;
      if(due)patch.at=R.serverTimestamp();
      if(!Object.keys(patch).length)return;
      try{await R.update(node,patch);rtSent=next;if(due)rtSentAt=Date.now();return;}catch(e){console.warn('online patch',e);}
    }
    const full={nickname:latest.nickname,avatar:latest.avatar,ph,info:lightInfo(latest.info),at:R.serverTimestamp()};
    try{await R.onDisconnect(node).remove();}catch(_){}
    await R.set(node,full);rtUid=u.uid;rtSent=next;rtSentAt=Date.now();
  };
  // 다른 생존자 사진: 지문이 같으면 브라우저에 저장해 둔 사진을 쓴다.
  const photoMem=new Map();
  const photoOf=(uid,ph,onLoad)=>{
    if(!ph)return '';
    const mem=photoMem.get(uid);if(mem&&mem.ph===ph)return mem.photo;
    try{const c=JSON.parse(localStorage.getItem('ll-photo-'+uid)||'null');if(c&&c.ph===ph){photoMem.set(uid,c);return c.photo;}}catch(_){}
    if(!mem||mem.ph!==ph){
      photoMem.set(uid,{ph,photo:mem?mem.photo:'',loading:true});
      R.get(path('photos/'+uid)).then(s=>{
        const photo=String(s.val()||'');const row={ph,photo};photoMem.set(uid,row);
        try{localStorage.setItem('ll-photo-'+uid,JSON.stringify(row));}catch(_){}
        onLoad();
      }).catch(()=>{});
    }
    return mem?mem.photo:'';
  };
  const watchConnection=()=>{
    if(offConnected)return;
    try{offConnected=R.onValue(path('.info/connected'),s=>{
      const was=rtConnected;rtConnected=s.val()===true;
      // 첫 연결은 이미 보낸 기록이 있으므로 건너뛰고, 끊겼다가 다시 붙을 때만 다시 등록한다.
      if(rtConnected&&!was){if(seenConnect&&latest){rtSent=null;rtBusy=rtBusy.then(()=>rtWrite(true)).catch(e=>console.warn('online rejoin',e));}seenConnect=true;}
    });}catch(_){}
  };
  const fsWrite=async(reason)=>{
    const u=auth.currentUser;if(!u||!latest)return;
    const body=JSON.stringify(latest);
    if(reason!=='force'&&body===fsSent&&Date.now()-fsSentAt<FS_MIN_GAP)return;
    // v36.11: Firestore 접속 기록에는 서버 규칙이 허용하는 항목만 보낸다(charId가 섞여 모든 기록이 거부되던 문제).
    const FS_INFO=['level','day','hp','maxHp','dead','weapon','armor','region','regionId','tripId','character','characterTraits','kills','explored','stats','d','companions','isGM','duelReady','charId'];
    const info={};for(const k of FS_INFO)if(latest.info&&latest.info[k]!==undefined)info[k]=latest.info[k];
    if(info.charId!==undefined)info.charId=String(info.charId).slice(0,140);
    if(info.character&&typeof info.character==='object'){const c={};for(const k of ['created','public','background','traits','appearance','personality','gender','age'])if(info.character[k]!==undefined)c[k]=typeof info.character[k]==='string'?info.character[k].slice(0,k==='gender'?20:k==='age'?16:(k==='traits'||k==='personality'?500:300)):info.character[k];info.character=c;}
    if(typeof info.hp==='number'&&typeof info.maxHp==='number')info.hp=Math.max(0,Math.min(Math.trunc(info.hp),Math.trunc(info.maxHp)));
    if(typeof info.region==='string')info.region=info.region.slice(0,40);
    const write=v=>F.setDoc(F.doc(db,'presence',u.uid),{nickname:latest.nickname,avatar:latest.avatar,info:v,photo:latest.photo,online:true,lastSeen:F.serverTimestamp()});
    // 서버 규칙이 아직 예전(charId 미허용)이면 charId만 빼고 한 번 더 쓴다.
    try{await write(info);}catch(e){if(info.charId===undefined||!String(e?.message||e).includes('PERMISSION'))throw e;const v={...info};delete v.charId;await write(v);}
    fsSent=body;fsKey=keyOf(latest);fsSentAt=Date.now();
  };
  const fsQueue=reason=>{const run=()=>fsWrite(reason);fsBusy=(fsBusy||Promise.resolve()).then(run,run);return fsBusy;};
  // 소셜 판정 직전: 마지막으로 보낸 내용과 다르면 Firestore에도 반영한다.
  // v36.6: 결투·치료 같은 판정 직전에는 접속 기록(lastSeen)도 새로 쓴다. 가만히 있던 사람의 기록이 오래돼 서버 규칙에 막히던 문제 수정.
  const presenceFlush=async()=>{
    if(!latest||!auth.currentUser)return;
    if(JSON.stringify(latest)!==fsSent||Date.now()-fsSentAt>120000)await fsQueue('force');
  };
  // v34: 입장한 생존자는 쪽지 허용 목록에 스스로 등록된다(GM 표시는 관리자 목록과 일치해야 저장됨).
  let dmListed='';
  const ensureDirectory=async u=>{
    const nickname=String(nickOf(u)).slice(0,16)||'생존자';
    const cid=(meId&&meId())||u.uid;
    const key=cid+'|'+nickname;if(dmListed===key)return;
    let current=null;try{current=(await R.get(path('dmDirectory/'+cid))).val();}catch(_){}
    if(current&&current.nickname===nickname){dmListed=key;return;}
    let gm=false;if(cid===u.uid){try{gm=(await R.get(path('dmAdmins/'+u.uid))).val()===true;}catch(_){}}
    await R.set(path('dmDirectory/'+cid),{uid:cid,nickname,isGM:gm});dmListed=key;
  };
  bridge.presenceFlush=presenceFlush;
  bridge.onlineDetail=async(uid,a2,a3)=>{
    const cb=typeof a2==='function'?a2:a3, wantCid=typeof a2==='string'?a2:'';
    // v36.42: 접속하지 않은 사람은 실시간 정보가 지워지므로, 마지막으로 저장된 접속 기록(체력 · 레벨)을 대신 보여 준다.
    try{user();const id=String(uid||'');const s=await R.get(path('onlineInfo/'+id));let info=s.val()||{};let offline=false,seen=0;
      if(!info||!Object.keys(info).length||info.maxHp==null){try{const on=(await R.get(path('online/'+id))).exists();const d=await F.getDoc(F.doc(db,'presence',id));if(d.exists()){const x=d.data()||{};const xi=x.info||{};
        if(!wantCid||(xi.charId||id)===wantCid){info={...xi,...info};offline=!on;seen=ms(x.lastSeen);}}}catch(_){}}
      reply(cb,{ok:true,uid:id,info,offline,lastSeen:seen});}
    catch(e){fail(cb,text(e));}
  };
  bridge.presenceBeat=async(json,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    let d={};try{d=JSON.parse(String(json||'{}'));}catch(_){}
    if(rtUid&&rtUid!==u.uid){rtSent=null;fsSent='';fsKey='';fsSentAt=0;}
    latest=build(d,u);watchConnection();
    try{
      rtBusy=rtBusy.then(()=>rtWrite(false),()=>rtWrite(false));await rtBusy;
      ensureDirectory(u).catch(e=>console.warn('dm directory',e));
      // v36.3: 결투 대기 중이라고 1분마다 Firestore에 쓰던 것을 없앴다(하루 쓰기 한도를 가장 많이 쓰던 부분).
      const changedKey=keyOf(latest)!==fsKey;
      const stale=Date.now()-fsSentAt>=FS_MIN_GAP;
      if(changedKey||(stale&&JSON.stringify(latest)!==fsSent))await fsQueue('force');
      reply(cb,{ok:true});
    }catch(e){fail(cb,text(e));}
  };
  const offlineAll=async()=>{
    const u=auth.currentUser;if(!u)return;
    try{await R.remove(path('online/'+u.uid));}catch(_){}
    try{await R.remove(path('onlineInfo/'+u.uid));}catch(_){}
    rtSent=null;rtUid='';latest=null;detailSent='';detailUid='';
  };
  const prevOff=bridge.presenceOff;
  bridge.presenceOff=async cb=>{await offlineAll();fsSent='';fsKey='';fsSentAt=0;return prevOff?prevOff(cb):reply(cb,{ok:true});};
  const prevSignOut=bridge.signOut;
  if(prevSignOut)bridge.signOut=async(...args)=>{await offlineAll();fsSent='';fsKey='';fsSentAt=0;return prevSignOut(...args);};
  window.addEventListener('pagehide',()=>{const u=auth.currentUser;if(u){try{R.remove(path('online/'+u.uid));}catch(_){}}});

  // v35: 접속자 목록은 화면에 보이는 정보(이름·사진·레벨·사망)가 바뀔 때만 보내고, 사진은 바뀐 사람 것만 보낸다.
  // (예전에는 2.5초마다 모든 사람의 사진까지 통째로 다시 보내 채팅·스크롤이 끊겼다)
  // v36.29: GM이 탈퇴·삭제된 계정처럼 남아 있는 접속 표시를 지운다(실시간 DB + Firestore presence).
  // v36.43: GM 공지 팝업 목록(notices/{id}). 지운 공지는 다시 뜨지 않는다.
  // v36.53: 낚시 대회 · fishEvent(GM만 쓰기) · fishEntries/{대회}/{캐릭터}(본인만 쓰기, 진행 중일 때만)
  bridge.watchFishEvent=cb=>{
    try{user();}catch(e){return fail(cb,text(e));}
    stopSub('fish_event');
    subs.fish_event=R.onValue(path('fishEvent'),s=>reply(cb,{ok:true,event:s.val()||{}}),e=>fail(cb,text(e)));
  };
  bridge.watchFishEntries=(eid,cb)=>{
    try{user();}catch(e){return fail(cb,text(e));}
    stopSub('fish_entries');eid=String(eid||'');if(!/^[A-Za-z0-9_-]{1,40}$/.test(eid))return fail(cb,'대회를 찾지 못했습니다.');
    subs.fish_entries=R.onValue(path('fishEntries/'+eid),s=>{const v=s.val()||{};
      reply(cb,{ok:true,entries:Object.entries(v).map(([id,x])=>({id,name:String((x||{}).name||'생존자').slice(0,16),best:Number((x||{}).best)||0,count:Number((x||{}).count)||0}))});},e=>fail(cb,text(e)));
  };
  bridge.fishEventOpen=async(kind,hours,cb)=>{
    try{const u=user();kind=kind==='most'?'most':'biggest';hours=Math.max(1,Math.min(168,Number(hours)||24));
      const now=Date.now(),id='f'+now.toString(36);
      await R.set(path('fishEvent'),{id,kind,starts:now,ends:now+hours*3600000,by:u.uid});reply(cb,{ok:true,id});}catch(e){fail(cb,text(e));}
  };
  bridge.fishEventClose=async cb=>{
    try{user();await R.update(path('fishEvent'),{ends:R.serverTimestamp()});reply(cb,{ok:true});}catch(e){fail(cb,text(e));}

  bridge.fishEntrySet=async(eid,name,best,count,cb)=>{
    try{const cid=(meId&&meId())||user().uid;eid=String(eid||'');if(!/^[A-Za-z0-9_-]{1,40}$/.test(eid))throw new Error('대회를 찾지 못했습니다.');
      const ref=path('fishEntries/'+eid+'/'+cid);const snap=await R.get(ref);const old=snap.val()||{};
      // 규칙: 처음 참가는 0/0, 이후에는 한 번에 1마리씩(4초 간격) · 기록은 줄지 않음
      const oc=Number(old.count)||0;const nc=snap.exists()?Math.min(oc+1,Math.max(oc,Math.floor(Number(count)||0))):0;
      const nb=snap.exists()?(nc>oc?Math.max(Number(old.best)||0,Math.min(10000,Number(best)||0)):Number(old.best)||0):0;
      await R.set(ref,{name:String(name||'생존자').slice(0,16),best:nb,count:nc,at:R.serverTimestamp()});
      reply(cb,{ok:true});}catch(e){fail(cb,text(e));}
  };
  bridge.adminNotice=async(title,body,cb)=>{
    try{const u=user();const id='n'+Date.now().toString(36);
      await R.set(path('notices/'+id),{id,title:String(title||'공지').slice(0,40),body:String(body||'').slice(0,600),at:R.serverTimestamp(),by:u.uid});
      reply(cb,{ok:true,id});}catch(e){fail(cb,text(e));}
  };
  bridge.adminDeleteNotice=async(id,cb)=>{
    try{user();await R.remove(path('notices/'+String(id||'').slice(0,40)));reply(cb,{ok:true});}catch(e){fail(cb,text(e));}
  };
  bridge.watchNotice=cb=>{
    stopSub('gmnotice');if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    const off=R.onValue(R.query(path('notices'),R.limitToLast(20)),s=>{const v=s.val()||{};
      const list=Object.values(v).filter(x=>x&&x.id).map(x=>({id:String(x.id),title:String(x.title||''),body:String(x.body||''),at:Number(x.at)||0})).sort((a,b)=>a.at-b.at);
      reply(cb,{ok:true,notices:list});},e=>fail(cb,text(e)));
    subs.gmnotice=()=>{try{off();}catch(_){}};
  };
  // v36.43: 파티 함께 탐사 · 각자 '나갈 수 있는 상태'인지 알린다(요청한 사람은 모두 준비되면 출발).
  bridge.setTripReady=async(tripId,ok,why,cb)=>{
    try{const u=user();const t=String(tripId||'').replace(/[.#$\[\]\/]/g,'').slice(0,60);if(!t)throw new Error('코스가 없습니다.');
      await R.set(path('tripReady/'+t+'/'+u.uid),{ok:ok===true,why:String(why||'').slice(0,80),at:R.serverTimestamp()});reply(cb,{ok:true});}catch(e){fail(cb,text(e));}
  };
  bridge.watchTripReady=(tripId,cb)=>{
    stopSub('tripready');if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    const t=String(tripId||'').replace(/[.#$\[\]\/]/g,'').slice(0,60);
    const off=R.onValue(path('tripReady/'+t),s=>reply(cb,{ok:true,trip:t,ready:s.val()||{}}),e=>fail(cb,text(e)));
    subs.tripready=()=>{try{off();}catch(_){}};
  };
  bridge.adminRemoveOnline=async(uid,cb)=>{
    try{uid=String(uid||'').slice(0,128);if(!uid)throw new Error('대상이 없습니다.');
      await R.update(R.ref(rtdb),{['online/'+uid]:null,['onlineInfo/'+uid]:null});
      try{await F.deleteDoc(F.doc(db,'presence',uid));}catch(_){}
      reply(cb,{ok:true});}catch(e){fail(cb,text(e));}
  };
  bridge.watchOnline=cb=>{
    stopSub('online');
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    let last={},timer=null,lastEmit=0,lastSig='',lastFull=0;const sentPh={};
    const emit=force=>{
      timer=null;
      const now=serverNow();
      const rows=Object.entries(last).map(([uid,x])=>[uid,x||{}]).filter(([,x])=>now-(Number(x.at)||now)<6*3600000)
        .sort((a,b)=>(Number(b[1].at)||0)-(Number(a[1].at)||0)).slice(0,100);
      const sig=rows.map(([uid,x])=>{const i=x.info||{};return [uid,x.nickname,x.avatar,x.ph||'',i.level,i.dead===true,i.isGM===true].join('|');}).join(';');
      if(!force&&sig===lastSig&&Date.now()-lastFull<30000)return;
      lastSig=sig;lastEmit=Date.now();lastFull=Date.now();
      const users=rows.map(([uid,x])=>{
        const row={online:true,uid,nickname:x.nickname||'?',avatar:Number(x.avatar)||0,ph:x.ph||'',info:x.info||{},age:Math.max(0,now-(Number(x.at)||now))};
        if(row.ph&&sentPh[uid]!==row.ph){const photo=photoOf(uid,row.ph,()=>{if(timer)clearTimeout(timer);timer=setTimeout(()=>emit(true),150);});if(photo){row.photo=photo;sentPh[uid]=row.ph;}}
        else if(!row.ph){row.photo='';sentPh[uid]='';}
        return row;
      });
      reply(cb,{ok:true,users});
    };
    const schedule=force=>{if(timer)return;timer=setTimeout(()=>emit(force===true),Math.max(0,3000-(Date.now()-lastEmit)));};
    const off=R.onValue(path('online'),s=>{last=s.val()||{};schedule();},e=>fail(cb,text(e)));
    const tick=setInterval(()=>schedule(),30000);
    subs.online=()=>{try{off();}catch(_){}clearInterval(tick);if(timer)clearTimeout(timer);};
  };

  // ---------- 친구: 관계·요청은 Firestore, 접속 상태는 RTDB ----------
  bridge.watchFriends=cb=>{
    let me;try{me=user();}catch(e){return fail(cb,text(e));}
    stopSub('friends');
    let relationDocs=[],requestDocs=[],peerStops=new Map(),rows=new Map(),offlineInfo=new Map(),timer=null;
    const emit=()=>{timer=null;
      const friends=Array.from(rows.values()).sort((a,b)=>String(a.nickname).localeCompare(String(b.nickname),'ko'));
      reply(cb,{ok:true,friends,requests:requestDocs.filter(d=>(d.data().status||'')==='pending').map(d=>{const x=d.data();return {id:d.id,from:x.from||'',to:x.to||'',actorName:x.actorName||'',createdAt:ms(x.createdAt)};})});
    };
    const later=()=>{if(!timer)timer=setTimeout(emit,300);};
    const sync=()=>{
      const wanted=new Map();
      relationDocs.forEach(d=>{const x=d.data(),peer=x.from===me.uid?x.to:x.from;if(peer)wanted.set(peer,(x.from===me.uid?x.toName:x.fromName)||'생존자');});
      for(const [peer,off] of peerStops)if(!wanted.has(peer)){try{off();}catch(_){}peerStops.delete(peer);rows.delete(peer);}
      for(const [peer,name] of wanted){
        if(peerStops.has(peer))continue;
        rows.set(peer,{uid:peer,nickname:name,avatar:0,photo:'',info:{},online:false});
        peerStops.set(peer,R.onValue(path('online/'+peer),async s=>{
          const v=s.val();
          if(v){const again=()=>{const r=rows.get(peer);if(r&&r.online){r.photo=photoOf(peer,v.ph,()=>{});later();}};rows.set(peer,{uid:peer,nickname:v.nickname||name,avatar:Number(v.avatar)||0,photo:photoOf(peer,v.ph,again),info:v.info||{},online:true});later();return;}
          let p=offlineInfo.get(peer);
          if(p===undefined){try{const snap=await F.getDoc(F.doc(db,'presence',peer));p=snap.exists()?snap.data():null;}catch(_){p=null;}offlineInfo.set(peer,p);}
          rows.set(peer,{uid:peer,nickname:(p&&p.nickname)||name,avatar:p?.avatar||0,photo:p?.photo||'',info:(p&&p.info)||{},online:false});later();
        },()=>{}));
      }
      later();
    };
    const offRelations=F.onSnapshot(F.query(F.collection(db,'friendships'),F.where('participants','array-contains',me.uid)),s=>{relationDocs=s.docs.filter(d=>d.data().status==='accepted');sync();},e=>fail(cb,text(e)));
    const offRequests=F.onSnapshot(F.query(F.collection(db,'friendRequests'),F.where('to','==',me.uid)),s=>{requestDocs=s.docs;later();},e=>fail(cb,text(e)));
    subs.friends=()=>{try{offRelations();offRequests();}catch(_){}for(const off of peerStops.values()){try{off();}catch(_){}}peerStops.clear();if(timer)clearTimeout(timer);};
  };

  // ---------- 월드 채팅 (RTDB worldChat/messages) ----------
  const WORLD='worldChat/messages';
  // v36.16: 월드 채팅은 3일만 보관한다. 접속할 때 가장 오래된 글부터 3일 지난 것을 조금씩 지운다(서버 규칙이 3일 지난 글만 지우게 허용).
  const WORLD_KEEP=3*86400000;let pruned=false;
  const pruneWorld=async()=>{
    if(pruned||typeof R.limitToFirst!=='function')return;pruned=true;
    try{
      const s=await R.get(R.query(path(WORLD),R.orderByKey(),R.limitToFirst(40)));
      const cut=Date.now()-WORLD_KEEP-60000;const upd={};
      s.forEach(c=>{const at=Number((c.val()||{}).createdAt)||0;if(at&&at<cut)upd[WORLD+'/'+c.key]=null;});
      if(Object.keys(upd).length)await R.update(R.ref(rtdb),upd);
    }catch(e){console.warn('world prune',e);}
  };
  let gmCache=null,gmOwner='';
  const isGM=async u=>{if(gmOwner===u.uid&&gmCache!==null)return gmCache;try{gmCache=(await R.get(path('dmAdmins/'+u.uid))).val()===true;}catch(_){gmCache=false;}gmOwner=u.uid;return gmCache;};
  const hhmm=t=>{const d=new Date(Number(t)||Date.now());return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const subscribe=bridge.subscribe,sendChat=bridge.sendChat,deleteChat=bridge.deleteChat;
  // v37.19: 쪽지처럼, 보낸 월드 메시지는 서버 응답을 기다리지 않고 화면에 먼저 보여 준다(실패하면 다시 뺀다).
  let worldLast=[],worldEmit=null;const pendingWorld=new Map();
  bridge.subscribe=(key,cb)=>{
    if(String(key)!=='world')return subscribe(key,cb);
    stopSub('world');
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    pruneWorld();
    isGM(auth.currentUser);  // v37.19: 운영자 여부를 미리 확인해 두어 첫 메시지도 바로 보낸다.
    worldLast=[];
    worldEmit=()=>{
      const ids=new Set(worldLast.map(m=>m.id)),extra=[];
      for(const [k,v] of pendingWorld){if(ids.has(k)){pendingWorld.delete(k);continue;}extra.push(v);}
      reply(cb,{ok:true,channel:'world',messages:worldLast.concat(extra)});
    };
    const off=R.onValue(R.query(path(WORLD),R.orderByKey(),R.limitToLast(50)),s=>{
      const cut=Date.now()-WORLD_KEEP;
      const messages=[];s.forEach(c=>{const x=c.val()||{};if(Number(x.createdAt)&&Number(x.createdAt)<cut)return;messages.push({id:c.key,uid:x.uid||'',isGM:x.isGM===true,nickname:x.nickname||'?',color:/^[0-9a-f]{6}$/.test(String(x.color||''))?x.color:'',text:x.text||'',time:hhmm(x.createdAt)});});
      worldLast=messages;worldEmit();
    },e=>fail(cb,text(e)));
    subs.world=()=>{worldEmit=null;off();};
  };
  // v36: 도배 제한 없이 한 번에 저장한다(예전에는 확인 왕복 2~3번 때문에 1~3초 걸렸다).
  bridge.sendChat=async(key,body,cb)=>{
    if(String(key)!=='world')return sendChat(key,body,cb);
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    body=String(body||'').trim();
    if(!body||body.length>200)return fail(cb,'메시지는 1~200자까지 보낼 수 있습니다.');
    const ref=R.push(path(WORLD)),nick0=String(nickOf(u)).slice(0,16)||'생존자',col=llColor();
    pendingWorld.set(ref.key,{id:ref.key,uid:u.uid,isGM:gmOwner===u.uid&&gmCache===true,nickname:nick0,color:/^[0-9a-f]{6}$/.test(String(col||''))?col:'',text:body,time:hhmm(Date.now()),pending:true});
    if(worldEmit)worldEmit();
    try{
      const gm=await isGM(u);
      const msg={uid:u.uid,nickname:nick0,text:body,isGM:gm,createdAt:R.serverTimestamp()};
      if(col)msg.color=col;
      // v36.3: 이름 색을 함께 보낸다. 서버 규칙이 아직 예전이면 색 없이 다시 보낸다.
      try{await R.set(ref,msg);}
      catch(e){if(!col||!String(e?.message||e).includes('PERMISSION_DENIED'))throw e;delete msg.color;await R.set(ref,msg);}
      reply(cb,{ok:true,cooldown:0});
    }catch(e){pendingWorld.delete(ref.key);if(worldEmit)worldEmit();fail(cb,text(e));}
  };
  bridge.deleteChat=async(channel,id,cb)=>{
    if(String(channel)!=='world')return deleteChat(channel,id,cb);
    try{user();await R.remove(path(WORLD+'/'+String(id)));reply(cb,{ok:true});}
    catch(e){fail(cb,String(e?.message||e).includes('PERMISSION_DENIED')?'관리자만 삭제할 수 있습니다. 관리자라면 실시간 DB 관리자 권한(dmAdmins) 동기화가 필요합니다 (python3 관리자권한동기화.py).':text(e));}
  };

  // v36.4: 결투 신청 전에 상대 상태를 Realtime Database에서 한 번만 확인한다(무료 읽기).
  // 상대가 접속 중이 아니거나 탐사·전투·이동 중이면 Firestore 결투 기록(읽기 6번·쓰기 5번)을 아예 만들지 않는다.
  if(typeof bridge.duelChallenge==='function'){
    const challenge=bridge.duelChallenge;
    bridge.duelChallenge=async(target,nonce,cb)=>{
      try{
        user();const t=String(target||'');
        const [on,info]=await Promise.all([R.get(path('online/'+t)),R.get(path('onlineInfo/'+t))]);
        const o=on.val(),i=info.val();
        if(!o)return fail(cb,'상대가 지금 접속 중이 아닙니다.');
        if(!i)return fail(cb,'상대의 정보를 아직 확인할 수 없습니다. 상대가 최신 버전으로 다시 접속한 뒤 시도해 주세요.');
        if(i.dead===true||(o.info&&o.info.dead===true))return fail(cb,'쓰러진 생존자에게는 결투를 신청할 수 없습니다.');
        if(i.duelReady===false)return fail(cb,'상대가 탐사·전투·이동 같은 활동 중이라 지금은 결투를 받을 수 없습니다. 잠시 뒤 다시 시도해 주세요.');
      }catch(e){return fail(cb,text(e));}
      return challenge(target,nonce,cb);
    };
  }

  // ---------- 소셜 판정 직전 presence 반영 ----------
  ['sendHealRequest','respondHeal','tryRevive','createTrade','respondTrade','friendRequest','friendRespond',
   'duelChallenge','duelRespond','createPartyTrip','startPartyTrip','respondPartyTrip','activatePartyTrip'].forEach(name=>{
    const orig=bridge[name];if(typeof orig!=='function')return;
    bridge[name]=(...args)=>presenceFlush().catch(e=>console.warn('presence flush',e)).then(()=>orig(...args));
  });

  // 탭이 숨겨질 때 게임이 등록한 저장 콜백을 부른다.
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&typeof bridge.onHidden==='function'){try{bridge.onHidden();}catch(_){}}});
}

if(typeof window!=='undefined')window.llColor=llColor;

/* v35 협력 기능. 서버 전체가 함께 쓰는 숫자(거점 보수 진행도, 월드 보스 체력, 구조 신호, 서버 주간 목표)는
   모두 Realtime Database에 둔다. 여러 명이 동시에 바꿔도 밀리지 않고, 읽기 횟수 요금이 없다. */
function installCoopBridge({R,F,db,auth,rtdb,bridge,reply,fail,subs,stopSub,nickOf}) {
  const path=p=>R.ref(rtdb,'coop/'+p);
  const user=()=>{const u=auth.currentUser;if(!u)throw new Error('로그인이 필요합니다.');return u;};
  const text=e=>{const s=String(e?.message||e||'요청에 실패했습니다.');return s.includes('PERMISSION_DENIED')||e?.code==='PERMISSION_DENIED'?'서버 규칙에 막혔습니다. 잠시 뒤 다시 시도하거나 v35 규칙 배포를 확인해 주세요.':s;};
  const nick=u=>String(nickOf(u)).slice(0,16)||'생존자';
  let offset=0;
  try{R.onValue(R.ref(rtdb,'.info/serverTimeOffset'),s=>{offset=Number(s.val())||0;});}catch(_){}
  const now=()=>Date.now()+offset;
  const DAY=86400000, HOUR=3600000;

  // ---------- 거점 보수 ----------
  const REPAIR=[
    {id:'wall',name:'외벽 보강',desc:'무너진 외벽과 바리케이드를 다시 세웁니다.',goal:{'고철':600,'목재':500,'테이프':300},buff:'coop_wall'},
    {id:'power',name:'발전기 복구',desc:'멈춘 발전기를 고쳐 거점에 불을 밝힙니다.',goal:{'전선':500,'고철':400,'테이프':250},buff:'coop_power'},
    {id:'water',name:'정수 설비 정비',desc:'빗물을 모아 마실 수 있게 거르는 설비입니다.',goal:{'빈병':400,'천':400,'알코올':250},buff:'coop_water'},
    {id:'clinic',name:'의무실 정비',desc:'다친 생존자를 눕힐 침상과 약품 선반을 갖춥니다.',goal:{'약초':400,'천':350,'알코올':300},buff:'coop_clinic'},
    {id:'storage',name:'창고 정리',desc:'흩어진 물자를 분류해 찾기 쉽게 정리합니다.',goal:{'종이':400,'목재':400,'빈병':300},buff:'coop_storage'}
  ];
  const BUFF_MS=72*HOUR, DONATE_MAX=50;
  const projectOf=stage=>{const base=REPAIR[((stage%REPAIR.length)+REPAIR.length)%REPAIR.length];const round=Math.floor(stage/REPAIR.length);const scale=Math.min(2,1+0.1*round);const goal={};for(const [k,v] of Object.entries(base.goal))goal[k]=Math.round(v*scale/10)*10;return {...base,goal,stage,round};};
  const freshState=stage=>{const p=projectOf(stage);const progress={};for(const k of Object.keys(p.goal))progress[k]=0;return {stage,progress,goal:p.goal,startedAt:R.serverTimestamp()};};

  // ---------- 월드 보스 ----------
  const BOSS_NAMES=['거대 감염체 「포식자」','변이 군체 「검은 둥지」','장갑 감염체 「철갑」','울부짖는 자','잿빛 거인','심연의 군주'];
  const BOSS_LIFE=24*HOUR, BOSS_REST=3*HOUR, BOSS_RETREAT_REST=1*HOUR, HIT_GAP=10*60000, HIT_MAX=3000;
  const bossFor=(gen,days)=>{const tier=gen*2+days;return {
    name:BOSS_NAMES[(gen-1)%BOSS_NAMES.length],level:Math.min(100,10+tier*3),
    maxHp:Math.min(120000,Math.round(12000*(1+0.06*tier)/100)*100),atk:Math.min(400,25+tier*4)};};

  let latest={repair:null,buffs:{},boss:null,sos:{},season:0,events:{}}, timer=null, lastEmit=0, cbs=[];
  const emit=()=>{timer=null;lastEmit=Date.now();
    const out={ok:true,now:now(),season:latest.season,repair:latest.repair?{...latest.repair,project:projectOf(Number(latest.repair.stage)||0)}:null,buffs:latest.buffs||{},boss:latest.boss,sos:latest.sos||{},events:latest.events||{}};
    cbs.forEach(cb=>reply(cb,out));};
  const schedule=()=>{if(timer)return;timer=setTimeout(emit,Math.max(0,1500-(Date.now()-lastEmit)));};
  let stops=[];
  const ensureStarted=async()=>{
    // 처음 쓰는 서버라면 시즌 시작 시각과 첫 보수 단계를 만든다(이미 있으면 아무것도 하지 않음).
    try{await R.runTransaction(path('meta/seasonStart'),v=>v?undefined:R.serverTimestamp(),{applyLocally:false});}catch(_){}
    try{await R.runTransaction(path('repair/state'),v=>v?undefined:freshState(0),{applyLocally:false});}catch(_){}
  };
  bridge.watchCoop=cb=>{
    stopSub('coop');
    if(!auth.currentUser)return fail(cb,'로그인이 필요합니다.');
    cbs=[cb];
    const on=(p,key)=>R.onValue(path(p),s=>{latest[key]=s.val();schedule();},e=>fail(cb,text(e)));
    stops=[on('repair/state','repair'),on('buffs','buffs'),on('boss/current','boss'),on('sos','sos'),on('meta/seasonStart','season'),on('events','events')];
    ensureStarted();
    subs.coop=()=>{stops.forEach(f=>{try{f();}catch(_){}});stops=[];cbs=[];if(timer){clearTimeout(timer);timer=null;}};
  };

  bridge.coopDonate=async(material,amount,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    material=String(material||'');amount=Math.max(1,Math.min(DONATE_MAX,parseInt(amount,10)||0));
    try{
      let accepted=0,completed=null;
      const tx=await R.runTransaction(path('repair/state'),s=>{
        if(!s)return freshState(0);
        const goal=s.goal||{},progress={...(s.progress||{})};
        if(!(material in goal)){accepted=0;return;}
        const room=Math.max(0,Number(goal[material])-Number(progress[material]||0));
        accepted=Math.min(room,amount);if(accepted<=0)return;
        progress[material]=Number(progress[material]||0)+accepted;
        return {...s,progress};
      },{applyLocally:false});
      if(!tx.committed||accepted<=0)return reply(cb,{ok:false,error:'이 재료는 이미 목표를 채웠습니다.',accepted:0});
      const st=tx.snapshot.val(),stage=Number(st.stage)||0;
      await R.runTransaction(path('repair/donors/'+stage+'/'+u.uid),d=>{
        const mats={...((d&&d.mats)||{})};mats[material]=Number(mats[material]||0)+accepted;
        return {nickname:nick(u),total:Number((d&&d.total)||0)+accepted,mats,at:R.serverTimestamp()};
      },{applyLocally:false});
      // 모든 재료가 목표에 닿으면 다음 단계로 넘기고 서버 효과를 켠다(여러 명이 동시에 눌러도 한 번만 넘어감).
      const done=Object.entries(st.goal||{}).every(([k,v])=>Number((st.progress||{})[k]||0)>=Number(v));
      if(done){
        const adv=await R.runTransaction(path('repair/state'),s=>{
          if(!s||Number(s.stage)!==stage)return;
          const ok=Object.entries(s.goal||{}).every(([k,v])=>Number((s.progress||{})[k]||0)>=Number(v));
          if(!ok)return;return freshState(stage+1);
        },{applyLocally:false});
        if(adv.committed){
          const p=projectOf(stage);
          try{await R.set(path('buffs/'+p.buff),{until:now()+BUFF_MS,at:R.serverTimestamp(),stage,name:p.name});}catch(e){console.warn('coop buff',e);}
          try{await R.set(path('repair/history/'+stage),{name:p.name,at:R.serverTimestamp()});}catch(_){}
          completed={stage,name:p.name,buff:p.buff};
        }
      }
      reply(cb,{ok:true,accepted,stage,completed});
    }catch(e){fail(cb,text(e));}
  };
  bridge.coopDonors=async(stage,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{
      const s=await R.get(path('repair/donors/'+(parseInt(stage,10)||0)));const rows=[];
      s.forEach(c=>{const v=c.val()||{};rows.push({uid:c.key,nickname:String(v.nickname||'생존자'),total:Number(v.total)||0,mats:v.mats||{}});});
      const byTotal=rows.slice().sort((a,b)=>b.total-a.total);
      const mine=rows.find(r=>r.uid===u.uid)||null;
      const rank=mine?1+byTotal.filter(r=>r.total>mine.total).length:0;
      const names=rows.map(r=>r.nickname).sort((a,b)=>a.localeCompare(b,'ko'));
      reply(cb,{ok:true,count:rows.length,names,mine,rank});
    }catch(e){fail(cb,text(e));}
  };

  // v36: 보스 체력은 서버 인원과 레벨로 정한다.
  //  최근 3일 안에 접속한 플레이어(GM 제외)마다 '한 번 공격 예상 피해 × 3번'을 더한 값 = 기본 체력.
  //  40명이 평균 100씩 친다면 약 12,000 (서버 전체 약 120번 공격). 잡을 때마다 다음 보스 +5%, 놓치면 -10%.
  const ACTIVE_WINDOW=3*DAY, HITS_PER_PLAYER=3;
  bridge.coopActive=async(level,hit,gm,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{gm=(await R.get(R.ref(rtdb,'dmAdmins/'+u.uid))).val()===true;}catch(_){gm=false;}
    try{await R.set(path('active/'+u.uid),{level:Math.max(1,Math.min(100,parseInt(level,10)||1)),hit:Math.max(1,Math.min(HIT_MAX,parseInt(hit,10)||1)),gm:gm===true,at:R.serverTimestamp()});reply(cb,{ok:true});}
    catch(e){fail(cb,text(e));}
  };
  const serverPower=async()=>{
    let rows={};try{rows=(await R.get(path('active'))).val()||{};}catch(_){}
    const t=now();let n=0,sumHit=0,sumLv=0;
    for(const v of Object.values(rows)){if(!v||v.gm===true||Number(v.at)<t-ACTIVE_WINDOW)continue;n++;sumHit+=Math.max(1,Number(v.hit)||1);sumLv+=Math.max(1,Number(v.level)||1);}
    return {players:n,avgLevel:n?sumLv/n:10,base:sumHit*HITS_PER_PLAYER};
  };
  bridge.coopBossSpawn=async(force,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{
      const power=await serverPower();
      const tx=await R.runTransaction(path('boss/current'),b=>{
        const t=now();
        if(b&&!force){
          const over=b.defeatedAt||Number(b.endsAt)<t;
          if(!over||t<Number(b.nextAt||0))return;
        }
        const gen=b?Number(b.gen||0)+1:1;
        let scale=b?Number(b.scale)||1:1;
        if(b&&!force&&!b.removed)scale=b.defeatedAt?scale*1.05:scale*0.9;
        scale=Math.max(0.5,Math.min(3,scale));
        const level=Math.max(5,Math.min(100,Math.round(power.avgLevel)+2));
        const maxHp=Math.max(1500,Math.min(120000,Math.round(power.base*scale/100)*100));
        // v37.26: 다음 습격은 이번 출현 시각부터 1~4일 사이(무작위). 쓰러뜨려도 · 물러나도 이 시각 전에는 나오지 않는다.
        const gap=Math.round(DAY*(1+Math.random()*3));
        return {id:'b'+gen+'-'+Math.floor(t/1000),gen,name:BOSS_NAMES[(gen-1)%BOSS_NAMES.length],level,hp:maxHp,maxHp,atk:Math.min(400,10+level*2),
          scale:Math.round(scale*1000)/1000,players:power.players,
          spawnedAt:R.serverTimestamp(),endsAt:t+BOSS_LIFE,nextAt:Math.max(t+gap,t+BOSS_LIFE+BOSS_RETREAT_REST)};
      },{applyLocally:false});
      reply(cb,{ok:true,spawned:tx.committed,boss:tx.snapshot.val()});
    }catch(e){fail(cb,force&&String(e?.message||e).includes('PERMISSION_DENIED')?'실시간 DB 관리자 권한(dmAdmins)이 없습니다. Cloud Shell에서 python3 관리자권한동기화.py 를 실행한 뒤 다시 시도하세요.':text(e));}
  };
  // v36.3 · 관리자: 보스 철수. hours 시간 뒤 다시 자동 소환, 0이면 관리자가 다시 소환할 때까지 멈춤.
  bridge.coopBossRemove=async(hours,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    hours=Math.max(0,Math.min(720,Number(hours)||0));
    try{
      const tx=await R.runTransaction(path('boss/current'),b=>{
        const t=now(),next=hours>0?t+hours*HOUR:t+3650*DAY;
        const base=b||{id:'none',gen:0,name:'',level:1,hp:0,maxHp:1,atk:0,spawnedAt:t};
        const out={...base,hp:Math.max(0,Number(base.hp)||0),endsAt:t,nextAt:next,removed:true,spawnedAt:Number(base.spawnedAt)||t};
        delete out.defeatedAt;return out;
      },{applyLocally:false});
      reply(cb,{ok:tx.committed});
    }catch(e){fail(cb,String(e?.message||e).includes('PERMISSION_DENIED')?'실시간 DB 관리자 권한(dmAdmins)이 없습니다. Cloud Shell에서 python3 관리자권한동기화.py 를 실행한 뒤 다시 시도하세요.':text(e));}
  };
  bridge.coopBossAttack=async(bossId,damage,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    bossId=String(bossId||'');damage=Math.max(1,Math.min(HIT_MAX,parseInt(damage,10)||0));
    try{
      const cur=(await R.get(path('boss/current'))).val();
      if(!cur||cur.id!==bossId||cur.defeatedAt||Number(cur.endsAt)<now())return reply(cb,{ok:false,error:'지금은 공격할 수 있는 거대 감염체가 없습니다.'});
      // 1) 내 공격 기록(10분 간격은 서버 규칙이 확인) 2) 공유 체력 차감
      const hitRef=path('boss/hits/'+bossId+'/'+u.uid);
      const hit=await R.runTransaction(hitRef,h=>{
        if(h&&Number(h.lastAt)>now()-HIT_GAP+15000)return;
        return {nickname:nick(u),dmg:Number((h&&h.dmg)||0)+damage,count:Number((h&&h.count)||0)+1,lastAt:R.serverTimestamp()};
      },{applyLocally:false});
      if(!hit.committed){const h=hit.snapshot.val()||{};const left=Math.max(1,Math.ceil((Number(h.lastAt||0)+HIT_GAP-now())/1000));return reply(cb,{ok:false,error:'다음 공격까지 '+Math.ceil(left/60)+'분 남았습니다.',wait:left});}
      let dealt=0,defeated=false;
      const tx=await R.runTransaction(path('boss/current'),b0=>{
        const b=b0||cur;  // v37.43: 처음 null로 불릴 때 멈추지 않게
        if(!b||b.id!==bossId||b.defeatedAt)return;
        dealt=Math.min(Number(b.hp),damage);const hp=Number(b.hp)-dealt;
        const next={...b,hp};
        if(hp<=0){next.hp=0;next.defeatedAt=R.serverTimestamp();next.nextAt=Number(b.nextAt)>now()+BOSS_REST?Number(b.nextAt):now()+BOSS_REST;defeated=true;}
        return next;
      },{applyLocally:false});
      if(!tx.committed)return reply(cb,{ok:false,error:'거대 감염체가 방금 쓰러졌거나 사라졌습니다.'});
      if(defeated){try{await R.set(path('buffs/coop_rally'),{until:now()+DAY,at:R.serverTimestamp(),stage:Number(tx.snapshot.val().gen)||0,name:'습격 격퇴'});}catch(e){console.warn('rally buff',e);}}
      const mine=hit.snapshot.val()||{};
      reply(cb,{ok:true,dealt,defeated,hp:Number(tx.snapshot.val().hp)||0,myDmg:Number(mine.dmg)||0,myCount:Number(mine.count)||0});
    }catch(e){fail(cb,text(e));}
  };
  bridge.coopBossMine=async(bossId,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{
      const s=await R.get(path('boss/hits/'+String(bossId||'')));let total=0,count=0,mine=null;
      s.forEach(c=>{const v=c.val()||{};total+=Number(v.dmg)||0;count++;if(c.key===u.uid)mine={dmg:Number(v.dmg)||0,count:Number(v.count)||0,lastAt:Number(v.lastAt)||0};});
      reply(cb,{ok:true,participants:count,total,mine,now:now()});
    }catch(e){fail(cb,text(e));}
  };

  // ---------- 구조 신호 ----------
  const SOS_LIFE=30*60000;
  bridge.coopSos=async(json,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    let d={};try{d=JSON.parse(String(json||'{}'));}catch(_){}
    try{
      await R.set(path('sos/'+u.uid),{nickname:nick(u),regionId:Math.max(0,Math.min(59,parseInt(d.regionId,10)||0)),region:String(d.region||'').slice(0,20),
        hp:Math.max(0,parseInt(d.hp,10)||0),maxHp:Math.max(1,parseInt(d.maxHp,10)||1),level:Math.max(1,parseInt(d.level,10)||1),at:R.serverTimestamp()});
      reply(cb,{ok:true});
    }catch(e){fail(cb,text(e));}
  };
  bridge.coopSosCancel=async cb=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{await R.remove(path('sos/'+u.uid));reply(cb,{ok:true});}catch(e){fail(cb,text(e));}

  bridge.coopAid=async(target,item,amount,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    target=String(target||'');if(!/^[A-Za-z0-9_-]{1,128}$/.test(target)||target===u.uid)return fail(cb,'도울 수 없는 대상입니다.');
    try{
      const s=(await R.get(path('sos/'+target))).val();
      if(!s||Number(s.at)<now()-SOS_LIFE)return reply(cb,{ok:false,error:'구조 신호가 이미 끝났습니다.'});
      if(s.helpers&&s.helpers[u.uid])return reply(cb,{ok:false,error:'이 신호에는 이미 물품을 보냈습니다.'});
      const id=R.push(path('aid/'+target)).key;
      const updates={};
      updates['aid/'+target+'/'+id]={from:u.uid,nickname:nick(u),item:String(item||'').slice(0,24),amount:Math.max(1,Math.min(400,parseInt(amount,10)||1)),at:R.serverTimestamp()};
      updates['sos/'+target+'/helpers/'+u.uid]=true;
      await R.update(R.ref(rtdb,'coop'),updates);
      reply(cb,{ok:true});
    }catch(e){fail(cb,text(e));}
  };
  bridge.watchCoopAid=cb=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    stopSub('coopAid');
    const off=R.onValue(path('aid/'+u.uid),s=>{const rows=[];s.forEach(c=>{const v=c.val()||{};rows.push({id:c.key,from:String(v.from||''),nickname:String(v.nickname||'생존자'),item:String(v.item||''),amount:Number(v.amount)||0});});if(rows.length)reply(cb,{ok:true,aid:rows});},()=>{});
    subs.coopAid=off;
  };
  bridge.coopAidTaken=async(ids,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    let list=[];try{list=JSON.parse(String(ids||'[]'));}catch(_){}
    try{const updates={};list.slice(0,20).forEach(id=>{if(/^[A-Za-z0-9_-]{1,40}$/.test(String(id)))updates['aid/'+u.uid+'/'+id]=null;});if(Object.keys(updates).length)await R.update(R.ref(rtdb,'coop'),updates);reply(cb,{ok:true});}catch(e){fail(cb,text(e));}
  };

  // ---------- v37.30 함께 밝히는 도시(시즌 복구율) · 최종 감염원 ----------
  // 시즌 S의 복구 목표 = 최근 3일 접속자(GM 제외, 최소 10명) × 60. 각자 '이번 시즌에 탐사한 서로 다른 구역 + 토벌 공격×3'을
  // season/S/u/{uid}.n 에 올리고, 늘어난 만큼 season/S/total 에 더한다(서버 규칙이 두 값의 차이를 맞춰 본다).
  // v37.41: 1인당 60 → 300점(시즌 약 2주)
  const CITY_PER=300, CITY_MAX=1500, CITY_STEP=80, FINAL_LIFE=72*HOUR;
  const FINAL_NAMES=['시즌 보스 「검은 심장」','시즌 보스 「잿빛 뿌리」','시즌 보스 「한강의 둥지」'];  // v37.42: '최종 감염원' → '시즌 보스'
  const citySeason=async()=>{
    let s=(await R.get(path('meta/season'))).val();
    if(!s){try{await R.runTransaction(path('meta/season'),v=>v?undefined:1,{applyLocally:false});}catch(_){}
      s=(await R.get(path('meta/season'))).val()||1;}
    return Number(s)||1;
  };
  const cityAdvance=async season=>{
    try{await R.runTransaction(path('meta/season'),v=>(v===null||Number(v)===season)?season+1:undefined,{applyLocally:false});}catch(e){console.warn('city season',e);}
  };
  // v37.44 GM: 시즌 보스가 쓰러진 뒤 다음 시즌 열기(실시간 DB 규칙: dmAdmins만 meta/season을 올릴 수 있다)
  bridge.cityAdvanceGM=async(expect,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    try{const season=await citySeason();
      if(Number(expect)&&Number(expect)!==season)return fail(cb,'이미 다음 시즌이 열렸습니다.');
      const fin=(await R.get(path('final/current'))).val();
      if(!fin||!fin.defeatedAt||Number(fin.season)!==season)return fail(cb,'시즌 보스를 쓰러뜨린 뒤에 다음 시즌을 열 수 있습니다.');
      await R.set(path('meta/season'),season+1);
      reply(cb,{ok:true,season:season+1});}
    catch(e){fail(cb,String(e&&e.code||e).toUpperCase().includes('PERMISSION')?'관리자 권한(실시간 DB 관리자 명단)이 필요합니다.':text(e));}
  };
  bridge.cityState=async cb=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}

      let season=await citySeason();
      let fin=(await R.get(path('final/current'))).val();

      let goal=(await R.get(path('season/'+season+'/goal'))).val();

        goal=(await R.get(path('season/'+season+'/goal'))).val()||want;}
      const [tot,mine]=await Promise.all([R.get(path('season/'+season+'/total')),R.get(path('season/'+season+'/u/'+u.uid))]);
      let finalMine=null;
      if(fin&&fin.id){const h=(await R.get(path('final/hits/'+fin.id+'/'+u.uid))).val();if(h)finalMine={dmg:Number(h.dmg)||0,count:Number(h.count)||0};}
      reply(cb,{ok:true,now:now(),season,goal:Number(goal)||600,total:Number(tot.val())||0,mine:Number((mine.val()||{}).n)||0,final:fin||{},final_mine:finalMine||{}});
    }catch(e){fail(cb,text(e));}
  };
  // v37.40 GM: 이번 시즌 도시 복구 목표 바꾸기(실시간 DB 규칙: dmAdmins만 · 100~600,000)
  bridge.cityGoalSet=async(goal,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    goal=Math.trunc(Number(goal));if(!Number.isFinite(goal)||goal<100||goal>600000)return fail(cb,'목표는 100~600,000점입니다.');

    catch(e){fail(cb,String(e&&e.code||'').includes('PERMISSION')||String(e).includes('PERMISSION')?'관리자 권한(실시간 DB 관리자 명단)이 필요합니다.':text(e));}
  };
  bridge.cityReport=async(season,n,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    season=parseInt(season,10)||0;n=Math.max(0,Math.min(CITY_MAX,parseInt(n,10)||0));

      const cur=(await R.get(path('season/'+season+'/u/'+u.uid))).val();
      const old=cur?Number(cur.n)||0:0;
      if(cur&&Number(cur.at)>now()-55000)return reply(cb,{ok:false,wait:true,n:old});
      const nn=Math.min(n,old+CITY_STEP),delta=nn-old;

      const updates={};

  bridge.cityFinalSpawn=async(force,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}

      const season=await citySeason();

      if(!force&&Number(ts.val()||0)<Number(gs.val()||1e12)*0.8)return reply(cb,{ok:true,spawned:false});
      const power=await serverPower();

        const t=now();

        const level=Math.max(10,Math.min(100,Math.round(power.avgLevel)+5));

        return {id:'f'+season+'-'+Math.floor(t/1000),season,name:FINAL_NAMES[(season-1)%FINAL_NAMES.length],level,hp:maxHp,maxHp,atk:Math.min(500,20+level*3),spawnedAt:R.serverTimestamp(),endsAt:t+FINAL_LIFE};
      },{applyLocally:false});
      reply(cb,{ok:true,spawned:tx.committed,final:tx.snapshot.val()||{}});
    }catch(e){fail(cb,force&&String(e?.message||e).includes('PERMISSION_DENIED')?'실시간 DB 관리자 권한(dmAdmins)이 없습니다.':text(e));}
  };
  bridge.cityFinalAttack=async(id,damage,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    id=String(id||'');damage=Math.max(1,Math.min(HIT_MAX,parseInt(damage,10)||0));
    try{
      const cur=(await R.get(path('final/current'))).val();
      if(!cur||cur.id!==id||cur.defeatedAt||Number(cur.endsAt)<now())return reply(cb,{ok:false,error:'지금은 공격할 수 있는 시즌 보스가 없습니다.'});
      const hit=await R.runTransaction(path('final/hits/'+id+'/'+u.uid),h=>{
        if(h&&Number(h.lastAt)>now()-HIT_GAP+15000)return;
        return {nickname:nick(u),dmg:Number((h&&h.dmg)||0)+damage,count:Number((h&&h.count)||0)+1,lastAt:R.serverTimestamp()};
      },{applyLocally:false});
      if(!hit.committed){const h=hit.snapshot.val()||{};const left=Math.max(1,Math.ceil((Number(h.lastAt||0)+HIT_GAP-now())/1000));return reply(cb,{ok:false,error:'다음 공격까지 '+Math.ceil(left/60)+'분 남았습니다.',wait:left});}
      let dealt=0,defeated=false;
      // v37.43: 트랜잭션은 처음에 이 기기에 저장된 값(없으면 null)으로 한 번 불린다 → null이면 방금 읽은 값으로 계산해 보낸다
      //         (서버 값과 다르면 서버 값으로 다시 불린다). 예전엔 null에서 바로 멈춰 '방금 쓰러졌거나 사라졌습니다'가 떴다.
      const tx=await R.runTransaction(path('final/current'),b0=>{
        const b=b0||cur;
        if(!b||b.id!==id||b.defeatedAt)return;
        dealt=Math.min(Number(b.hp),damage);const hp=Number(b.hp)-dealt;const next={...b,hp};
        if(hp<=0){next.hp=0;next.defeatedAt=R.serverTimestamp();defeated=true;}
        return next;
      },{applyLocally:false});
      if(!tx.committed)return reply(cb,{ok:false,error:'시즌 보스가 방금 쓰러졌거나 사라졌습니다.'});
      // v37.44: 쓰러뜨려도 시즌은 GM이 넘긴다(시즌 대기 중)
      const mine=hit.snapshot.val()||{};
      reply(cb,{ok:true,dealt,defeated,hp:Number(tx.snapshot.val().hp)||0,myDmg:Number(mine.dmg)||0,myCount:Number(mine.count)||0});
    }catch(e){fail(cb,text(e));}
  };

  // ---------- 서버 주간 목표 ----------
  const WEEK_KINDS=['kill','explore','craft','boss','donate'], WEEK_STEP=300;
  bridge.coopWeeklyAdd=async(week,json,cb)=>{

    try{

      // v36.29: 서버 주간 목표를 가입 계정 수에 맞춘다. 계정 수는 세션당 6시간에 한 번만 센다(1000명당 읽기 1회).
      let accounts=0;
      // v36.52: 가입 계정 전체가 아니라 최근 14일 안에 접속한 계정 수로 목표를 맞춘다(쉬는 계정 제외). 실패하면 가입 계정 수.
      try{const c=JSON.parse(localStorage.getItem('ll_active_accounts')||'{}');if(c.n&&Date.now()-c.t<21600000)accounts=c.n;}catch(_){}
      if(!accounts&&F&&F.getCountFromServer){
        try{const since=F.Timestamp?F.Timestamp.fromMillis(Date.now()-14*86400000):new Date(Date.now()-14*86400000);
          const r=await F.getCountFromServer(F.query(F.collection(db,'presence'),F.where('lastSeen','>=',since)));accounts=r.data().count||0;}catch(_){}
        if(!accounts){try{const r=await F.getCountFromServer(F.collection(db,'profiles'));accounts=r.data().count||0;}catch(_){}}
        if(accounts){try{localStorage.setItem('ll_active_accounts',JSON.stringify({n:accounts,t:Date.now()}));}catch(_){}}}
      reply(cb,{ok:true,week,total:p.val()||{},mine:m.val()||{},accounts});
    }catch(e){fail(cb,text(e));}
  };
  // ---------- 관리자 · 반려동물 출현 이벤트 ----------
  bridge.coopPetEvent=async(species,minutes,cb)=>{

    try{

      await R.set(path('events/pet'),{id:'gm-pet-'+Math.floor(t/1000),species:String(species||'').slice(0,12),until:t+minutes*60000,at:R.serverTimestamp(),by:nick(u)});
      reply(cb,{ok:true});
    }catch(e){fail(cb,String(e?.message||e).includes('PERMISSION_DENIED')?'실시간 DB 관리자 권한(dmAdmins)이 없습니다. Cloud Shell에서 python3 관리자권한동기화.py 를 실행한 뒤 다시 시도하세요.':text(e));}
  };
  // 보상은 계정당 한 번(캐릭터를 바꿔도 다시 받지 못함)
  bridge.coopClaim=async(key,cb)=>{
    let u;try{u=user();}catch(e){return fail(cb,text(e));}
    key=String(key||'');if(!/^[A-Za-z0-9_-]{1,80}$/.test(key))return fail(cb,'보상 키가 올바르지 않습니다.');
    try{const tx=await R.runTransaction(path('claims/'+u.uid+'/'+key),v=>v?undefined:R.serverTimestamp(),{applyLocally:false});
      reply(cb,tx.committed?{ok:true}:{ok:false,error:'이미 받은 보상입니다. (같은 계정의 다른 캐릭터 포함)'});}
    catch(e){fail(cb,text(e));}
  };
  // v36.10: 관리자 진단 · 실시간 DB 관리자 명단(dmAdmins)에 내 계정이 있는지 확인한다.
  bridge.adminRtdbStatus=async cb=>{

    try{const v=(await R.get(R.ref(rtdb,'dmAdmins/'+u.uid))).val()===true;reply(cb,{ok:true,rtdb:v,uid:u.uid});}
    catch(e){reply(cb,{ok:true,rtdb:false,uid:u.uid,error:text(e)});}
  };
  bridge.coopAvailable=true;
}

// char-bridge:start
/* v36 캐릭터 슬롯 · 캐릭터별 친구.
   - 계정당 캐릭터 2개. 첫 캐릭터 ID = 계정 UID(기존 기록·친구·쪽지 유지), 두 번째부터 UID_c숫자.
   - 지금 플레이하는 캐릭터만 saves/{uid}에 있고, 쉬는 캐릭터는 charSaves/{캐릭터ID}에 보관했다가 바꿀 때 맞바꾼다.
     (교환·치료·결투 같은 기존 기능은 그대로 saves/{uid}만 보면 된다)
   - 친구는 캐릭터끼리 맺는다(Realtime Database cfriend/creq). */
function installCharBridge({F,R,auth,db,rtdb,bridge,reply,fail,message,subs,stopSub,current,getChars,setChars,activeChar,nickOf,nameKey}) {
  const NAME=/^[가-힣A-Za-z0-9]{2,10}$/;
  const user=()=>{const u=auth.currentUser;if(!u)throw new Error('로그인이 필요합니다.');return u;};
  const err=e=>{const s=String(e?.message||e||'');if(e?.code==='permission-denied'||s.includes('PERMISSION_DENIED'))return '서버 규칙에 막혔습니다. v36 규칙 배포를 확인하거나 잠시 뒤 다시 시도해 주세요.';return typeof message==='function'&&e?.code?message(e):s;};
  const charsRef=uid=>F.doc(db,'characters',uid);
  const stamp=()=>F.serverTimestamp();
  const checkName=n=>{n=String(n||'').trim();if(!NAME.test(n))throw new Error('캐릭터 이름은 한글·영문·숫자 2~10자로 적어 주세요. (띄어쓰기·기호 불가)');return n;};
  // v36.5: 나이는 18세 이상, 상한 없음. 화면에 보일 글(예: '스물다섯 살')은 ageText로 따로 둔다.
  const checkAge=a=>{a=Number(a);if(!Number.isSafeInteger(a)||a<18)throw new Error('나이는 18세 이상으로 적어 주세요.');return a;};
  const checkAgeText=s=>{s=String(s||'').trim().slice(0,16);if(/[<>\[\]{}]/.test(s))throw new Error('나이 표시에 쓸 수 없는 기호가 있습니다.');return s;};
  const splitArgs=(a3,a4)=>typeof a3==='function'?{ageText:'',cb:a3}:{ageText:a3,cb:a4};
  const refresh=async u=>{const s=await F.getDoc(charsRef(u.uid));if(s.exists())setChars(s.data());};
  const docOf=(d,extra)=>{const out={active:d.active,list:d.list,counter:Number(d.counter)||1,updatedAt:stamp(),...extra};if(d.deletedAt&&!('deletedAt' in (extra||{})))out.deletedAt=d.deletedAt;return out;};
  const rev=p=>Math.max(0,parseInt(p&&p.socialRevision,10)||0);

  // v36.18: 지금 캐릭터의 레벨이 바뀌면 캐릭터 목록·계정 프로필 레벨도 바로 맞춘다(타이틀·캐릭터 관리에 옛 레벨이 보이던 문제).
  // v36.54: 입장 화면용 · 캐릭터 목록의 레벨 대신 실제 저장 기록의 레벨을 읽는다(목록이 늦게 갱신돼 Lv.1로 보이던 문제).
  bridge.charLevels=async cb=>{
    try{const u=user();const d=getChars();const out={};
      if(d&&d.list){for(const cid of Object.keys(d.list)){
        try{const s=await F.getDoc(cid===d.active?F.doc(db,'saves',u.uid):F.doc(db,'charSaves',cid));
          const lv=s.exists()?parseInt(((s.data()||{}).player||{}).level,10):NaN;if(lv>=1&&lv<=100)out[cid]=lv;}catch(_){}}
        const fixed={...d.list};let changed=false;
        for(const cid of Object.keys(out)){if(fixed[cid]&&Number(fixed[cid].level)!==out[cid]){fixed[cid]={...fixed[cid],level:out[cid]};changed=true;}}
        if(changed){try{await F.setDoc(charsRef(u.uid),docOf(d,{list:fixed}));setChars({...d,list:fixed});}catch(_){}}}
      reply(cb,{ok:true,levels:out});
    }catch(e){fail(cb,err(e));}
  };
  bridge.syncCharLevel=async(level,cb)=>{
    try{
      const u=user();level=Math.max(1,Math.min(100,parseInt(level,10)||1));
      const d=getChars();const cid=activeChar();
      if(d&&d.list&&d.list[cid]&&Number(d.list[cid].level)!==level){
        await F.setDoc(charsRef(u.uid),docOf(d,{list:{...d.list,[cid]:{...d.list[cid],level}}}));
        setChars({...d,list:{...d.list,[cid]:{...d.list[cid],level}}});
      }
      try{await F.setDoc(F.doc(db,'profiles',u.uid),{level,updatedAt:stamp()},{merge:true});}catch(_){}
      reply(cb,{ok:true,level});
    }catch(e){fail(cb,err(e));}
  };
  bridge.charSetup=async(name,age,a3,a4)=>{
    let {ageText,cb}=splitArgs(a3,a4);
    try{
      const u=user();name=checkName(name);age=checkAge(age);ageText=checkAgeText(ageText);
      // v36.61: 같은 계정이 등록해 둔 이름이면(목록이 꼬여 다른 캐릭터 ID로 남은 경우) 먼저 풀어 준다.
      try{const cur=getChars();const cid0=cur&&cur.active;const ns0=await F.getDoc(F.doc(db,'charNames',nameKey(name)));
        if(ns0.exists()&&ns0.data().owner===u.uid&&ns0.data().charId!==cid0&&!(cur&&cur.list&&cur.list[ns0.data().charId]))await F.deleteDoc(ns0.ref);}catch(_){}
      await F.runTransaction(db,async tx=>{
        const snap=await tx.get(charsRef(u.uid));if(!snap.exists())throw new Error('캐릭터 정보를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
        const d=snap.data(),cid=d.active,entry=d.list[cid]||{};
        const key=nameKey(name),nref=F.doc(db,'charNames',key),ns=await tx.get(nref);
        if(ns.exists()&&ns.data().charId!==cid)throw new Error('이미 다른 생존자가 쓰는 이름입니다.');
        const oldKey=entry.name&&entry.setup!==false?nameKey(entry.name):'';
        let oldRef=null;if(oldKey&&oldKey!==key){const os=await tx.get(F.doc(db,'charNames',oldKey));if(os.exists()&&os.data().charId===cid)oldRef=os.ref;}
        if(oldRef)tx.delete(oldRef);
        if(!ns.exists())tx.set(nref,{owner:u.uid,charId:cid,name,createdAt:stamp()});
        tx.set(charsRef(u.uid),docOf(d,{list:{...d.list,[cid]:{...entry,name,age,ageText,setup:true}}}));
      });
      await refresh(u);reply(cb,current());
    }catch(e){fail(cb,err(e));}
  };

  bridge.charCreate=async(name,age,a3,a4)=>{
    let {ageText,cb}=splitArgs(a3,a4);
    try{
      const u=user();name=checkName(name);age=checkAge(age);ageText=checkAgeText(ageText);let newId='';
      await F.runTransaction(db,async tx=>{
        const cref=charsRef(u.uid),snap=await tx.get(cref);if(!snap.exists())throw new Error('캐릭터 정보를 불러오지 못했습니다.');
        const d=snap.data();
        if(Object.keys(d.list||{}).length>=2)throw new Error('캐릭터는 계정당 2개까지 만들 수 있습니다.');
        const del=d.deletedAt&&d.deletedAt.toMillis?d.deletedAt.toMillis():0;
        if(del&&Date.now()<del+7*86400000)throw new Error('캐릭터를 삭제한 뒤 7일 동안은 새로 만들 수 없습니다.');
        const save=await tx.get(F.doc(db,'saves',u.uid));if(!save.exists())throw new Error('지금 캐릭터로 한 번 입장해 기록을 만든 뒤 새 캐릭터를 만들 수 있습니다.');
        const key=nameKey(name),nref=F.doc(db,'charNames',key),ns=await tx.get(nref);
        if(ns.exists())throw new Error('이미 다른 생존자가 쓰는 이름입니다.');
        const counter=(Number(d.counter)||1)+1;newId=u.uid+'_c'+counter;
        const s=save.data(),player=s.player||{};
        tx.set(F.doc(db,'charSaves',d.active),{player,log:Array.isArray(s.log)?s.log.slice(-80):[],updatedAt:stamp()});

      bridge.signIn = async (username, password, cb) => {

          const cred = await A.signInWithEmailAndPassword(auth, username + "@" + ID_DOMAIN, String(password));

            await F.setDoc(F.doc(db, "profiles", user.uid), { username: usernameOf(user), nickname: base.nickname, level, updatedAt: F.serverTimestamp() }, { merge: true });

      bridge.loadGame = async (cb) => {

      // ---------- 실시간 채팅 / 온라인 파티 ----------

      A.onAuthStateChanged(auth, (user) => {

      const hhmm = (ts) => {
        const t = ts && ts.toDate ? ts.toDate() : new Date();

      const channelRef = (channel) => {

      const partyOut = (d) => {

      async function findMyParty(user) {
        const q = F.query(F.collection(db, "parties"), F.where("members", "array-contains", user.uid), F.limit(1));

      bridge.createParty = async (name, cb) => {

          const nick = String(nickOf(user) || "생존자").slice(0, 16);
          const data = { name, leader: user.uid, leaderName: nick, members: [user.uid], memberNames: { [user.uid]: nick }, max: 8, createdAt: F.serverTimestamp() };
          const ref = await F.addDoc(F.collection(db, "parties"), data);
          reply(cb, { ok: true, party: { id: ref.id, name, leader: user.uid, leaderName: nick, members: [user.uid], memberNames: { [user.uid]: nick }, max: 8 } });
        } catch (e) { fail(cb, message(e)); }

      bridge.joinParty = async (pid, cb) => {
        const user = auth.currentUser;
        if (!user) return fail(cb, "로그인이 필요합니다.");
        try {
          if (await findMyParty(user)) return fail(cb, "이미 다른 파티에 속해 있습니다. 먼저 탈퇴하세요.");
          const ref = F.doc(db, "parties", String(pid));

          if (!snap.exists()) return fail(cb, "이미 해체된 파티입니다.");

          await F.updateDoc(ref, { members: F.arrayUnion(user.uid), ["memberNames." + user.uid]: String(nickOf(user) || "생존자").slice(0, 16) });

      // ---------- 관리자 / 관리자 명령 ----------
      bridge.deleteChat = async (channel, id, cb) => {
        if (!auth.currentUser) return fail(cb, "로그인이 필요합니다.");
        try {
          await F.deleteDoc(F.doc(channelRef(String(channel || "")), String(id)));
