        } catch (e) { fail(cb, e && e.code === "permission-denied" ? "관리자만 삭제할 수 있습니다." : message(e)); }
      };
      bridge.adminListPlayers = async (cb) => {
        if (!auth.currentUser) return fail(cb, "로그인이 필요합니다.");
        try {
          const s = await F.getDocs(F.query(F.collection(db, "profiles"), F.orderBy("updatedAt", "desc"), F.limit(50)));
          const players = await Promise.all(s.docs.map(async (d) => {
            const x = d.data();
            const row = { uid: d.id, username: x.username || "", nickname: x.nickname || "", level: x.level || 1, hasSave: false, dead: false, hp: 0, maxHp: 0 };
            // v36.44: 캐릭터 목록(이름 · 레벨)도 함께 보낸다.
            try {
              const ch = await F.getDoc(F.doc(db, "characters", d.id));
              const list = ch.exists() ? (ch.data().list || {}) : {};
              row.chars = Object.entries(list).map(([id, c]) => ({ id, name: String((c && c.name) || x.nickname || "생존자"), level: Number(c && c.level) || 1, active: id === (ch.data().active || d.id) }));
            } catch (e) { row.chars = []; }
            try {
              const sv = await F.getDoc(F.doc(db, "saves", d.id));
              if (sv.exists()) {

                row.hasSave = true; row.dead = !!p.dead; row.hp = Number(p.hp) || 0; row.maxHp = Number(p.max_hp) || 0;
              }
            } catch (e) {}
            return row;
          }));
          reply(cb, { ok: true, players });
        } catch (e) { fail(cb, e && e.code === "permission-denied" ? "관리자만 볼 수 있습니다." : message(e)); }
      };
      bridge.adminAct = async (uid, action, cb) => {

        try { await F.deleteDoc(F.doc(db, "parties", String(pid))); reply(cb, { ok: true }); }
        catch (e) { fail(cb, e && e.code === "permission-denied" ? "관리자만 해체할 수 있습니다." : message(e)); }
      };
      bridge.adminGive = async (uid, money, itemsJson, cb) => {

        const clean = {};
        Object.keys(items).slice(0, 20).forEach((k) => {

        });

      };

          if ((action === 'set_daily_quests' || action === 'set_weekly_quests') && (value !== 0 || !/^[a-z0-9_,]{0,200}$/.test(String(stat || '')))) return fail(cb,'퀘스트 목록을 확인하세요.');
          if ((action === 'grant_positive' || action === 'grant_condition') && (value < 60 || value > 31536000)) return fail(cb,'지속 시간은 1분~1년입니다.');
          await F.addDoc(F.collection(db, 'adminControls', String(uid), 'commands'), {

/*
 * GM virtual-currency bridge.
 *
 * Security contract:
 * - admins/{uid} is only a UX preflight; Firestore is authoritative.
 * - each grant uses gm_<nonce>_<targetUid>, so a network retry cannot queue a
 *   second command for that target.
 * - all-user campaigns first persist an immutable, paged target snapshot.  A
 *   retry with the same nonce resumes that snapshot rather than discovering a
 *   newly changed audience.
 * - currency commands are claimed atomically with save mutation, immutable
 *   receipt creation and command deletion. This proof guards this grant path;
 *   the original client-owned gameplay coin reward contract is preserved.
 */
function installGMCurrencyBridge({F,auth,db,bridge,reply,fail,message,nickOf,activeChar}) {
  const MAX_AMOUNT = 1000000;

  const uidPattern = /^[A-Za-z0-9_-]{1,128}$/;
  const noncePattern = /^[A-Za-z0-9_-]{12,96}$/;

    money_individual: true,
    money_all: true,
    coins_individual: true,
    coins_all: true
  });
  const text = (error) => {
    try { return typeof message === "function" ? message(error) : String((error && (error.message || error.code)) || "요청에 실패했습니다."); }
    catch (_) { return "요청에 실패했습니다."; }
  };
  const user = () => {
    const current = auth.currentUser;
    if (!current) throw new Error("로그인이 필요합니다.");
    return current;
  };
  const cleanUid = (value, label = "대상") => {
    const uid = String(value || "").trim();
    if (!uidPattern.test(uid)) throw new Error(label + " UID가 올바르지 않습니다.");
    return uid;
  };
  const cleanNonce = (value) => {
    const nonce = String(value || "").trim();
    if (!noncePattern.test(nonce)) throw new Error("재시도 식별자가 올바르지 않습니다. 지급 내용을 다시 검토하세요.");
    return nonce;
  };
  const cleanAmount = (value) => {
    const amount = Number(value);
    if (!Number.isSafeInteger(amount) || amount < 1 || amount > MAX_AMOUNT) {
      throw new Error("수량은 1~1,000,000 사이의 양의 정수여야 합니다.");
    }
    return amount;
  };
  const cleanKind = (value) => {
    const kind = String(value || "");
    if (kind !== "money" && kind !== "coins") throw new Error("허용되지 않은 지급 종류입니다.");
    return kind;
  };
  const commandId = (nonce, uid) => "gm_" + nonce + "_" + uid;
  const commandRef = (uid, id) => F.doc(db, "adminControls", uid, "commands", id);
  const receiptRef = (uid, id) => F.doc(db, "adminControlReceipts", uid, "entries", id);
  const campaignRef = (nonce) => F.doc(db, "gmCurrencyCampaigns", nonce);
  const campaignPageRef = (nonce, page) => F.doc(db, "gmCurrencyCampaigns", nonce, "pages", "p_" + String(page).padStart(6, "0"));
  const campaignCompleteRef = (nonce) => F.doc(db, "gmCurrencyCampaigns", nonce, "meta", "complete");
  const sameArray = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((value, index) => value === b[index]);

  const sameReceipt = (data, spec) => !!data && data.grantId === spec.id && data.kind === spec.kind && data.amount === spec.amount;
  const sameCampaign = (data, spec) => !!data && data.nonce === spec.nonce && data.kind === spec.kind

  const ensureAdmin = async () => {
    const current = user();

  });

      if (command.exists() && !sameGrant(command.data(), spec)) throw new Error("동일 재시도 식별자가 다른 지급 명령과 충돌했습니다. 지급 내용을 수정해 새로 시작하세요.");
      if (receipt.exists() && !sameReceipt(receipt.data(), spec)) throw new Error("동일 재시도 식별자의 수령 영수증이 일치하지 않습니다. 새 지급을 시작하세요.");
      if (command.exists() && receipt.exists()) throw new Error("명령과 영수증 상태가 동시에 존재합니다. 재시도하지 말고 관리 기록을 확인하세요.");
      return { target, spec, command: command.exists(), receipt: receipt.exists() };
