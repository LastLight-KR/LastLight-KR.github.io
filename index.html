<!doctype html>
<html lang="ko-KR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="lastlight-build" content="v37.73">
<meta name="theme-color" content="#0d1413">
<meta name="description" content="LastLight · 꺼지기 전에, 함께 살아남는 생존 게임">
<title>LastLight</title>
<link rel="icon" type="image/svg+xml" href="lastlight-icon.svg">
<link rel="icon" type="image/png" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<link rel="stylesheet" href="app/style.css?v=v37.73">
</head>
<body>
<!-- 첫 화면: 로그인 · 회원가입 · 캐릭터 고르기 -->
<section id="title" aria-label="입장">
  <div class="tcard">
    <div class="tlogo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v2M14 3v2M8 7h8l1 3v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8z"/><path d="M12 11c1.2 1.4 1.8 2.3 1.8 3.2a1.8 1.8 0 0 1-3.6 0c0-.9.6-1.8 1.8-3.2z" fill="currentColor"/><path d="M7 21h10"/></svg></div>
    <h1>LastLight</h1>
    <p class="tsub">꺼지기 전에, 함께 살아남아요</p>
    <p class="tact" id="tAct">편의점 선반을 뒤지는 중…</p>
    <div id="tLogin">
      <div class="ttabs" role="tablist">
        <button type="button" role="tab" id="tabIn" aria-selected="true">로그인</button>
        <button type="button" role="tab" id="tabUp" aria-selected="false">회원가입</button>
      </div>
      <form id="fLogin" style="display:grid;gap:12px;margin-top:12px" autocomplete="on">
        <label class="field"><span>아이디</span><input id="inId" autocomplete="username" maxlength="16" autocapitalize="none" spellcheck="false" placeholder="영문 소문자·숫자·_ 4~16자" required></label>
        <label class="field"><span>비밀번호</span><input id="inPw" type="password" autocomplete="current-password" maxlength="64" placeholder="6자 이상" required></label>
        <label class="field" id="fPw2" hidden><span>비밀번호 확인</span><input id="inPw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력"></label>
        <label class="field" id="fNick" hidden><span>계정 닉네임 <small>(나만 보임 · 게임에서는 캐릭터 이름이 보입니다)</small></span><input id="inNick" maxlength="10" placeholder="한글 가능, 2~10자"></label>
        <label class="field" id="fCode" hidden><span>가입 코드</span><input id="inCode" maxlength="32" autocapitalize="none" placeholder="관리자에게 받은 코드"></label>
        <p class="terr" id="tErr"></p>
        <button class="btn primary" style="min-height:50px;font-size:16px" id="bSubmit">로그인</button>
        <button class="btn" type="button" id="bToUp">처음이신가요? 회원가입하고 시작하기</button>
      </form>
      <p class="tnote" id="tNote" style="margin-top:6px">기록은 계정에 저장되어 어느 기기에서든 이어서 할 수 있어요.</p>
    </div>
    <div id="tChars" hidden style="display:grid;gap:12px">
      <button class="btn primary" style="min-height:50px;font-size:16px" id="bEnter">입장</button>
      <div style="font-weight:700;font-size:15px">캐릭터를 선택하세요</div>
      <div class="charlist" id="charList"></div>
      <p class="terr" id="tErr2"></p>
      <button class="btn" type="button" id="bSignOut">로그아웃</button>
    </div>
    <p class="tver" id="tVer"></p>
  </div>
</section>

<!-- 게임 화면 -->
<div id="app" hidden></div>
<div id="saveBar" hidden role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="app/data.js?v=v37.73"></script>
<script type="module" src="app/bridge.js?v=v37.73"></script>
<script type="module" src="app/app.js?v=v37.73"></script>
</body>
</html>
